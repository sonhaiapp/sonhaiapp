// ------------------------------------------------------------ atalhos da tela inicial (cada cliente escolhe 3)
const ATALHOS = { contas: ['🧾', 'Contas'], cartoes: ['💳', 'Cartões'], sonhos: ['⭐', 'Sonhos'], gastos: ['🛒', 'Gastos'], rendas: ['💰', 'Rendas'], agenda: ['📌', 'Agenda'], relatorios: ['📈', 'Relatórios'], parcelados: ['🛍️', 'Parcelados'], dividas: ['📉', 'Dívidas'], anuais: ['📅', 'Gastos do ano'], whatsapp: ['💬', 'Mensagens'], ajustes: ['⚙️', 'Ajustes'] };
const ATALHOS_PADRAO = ['contas', 'cartoes', 'sonhos'];
function atalhosValidos(){ return Object.keys(ATALHOS).filter((k) => typeof TELAS[k] === 'function'); }
function meusAtalhos(){
  const ok = atalhosValidos();
  const a = ((S.perfil && S.perfil.atalhos) || []).filter((k) => ok.includes(k));
  return a.length === 3 ? a : ATALHOS_PADRAO.filter((k) => ok.includes(k));
}
function blocoAtalhos(){
  return '<section class="card" aria-label="Meus atalhos"><div class="cardhead" style="margin-bottom:10px"><h2 style="font-size:18px">⚡ Meus atalhos</h2><button class="link" id="at-trocar">Trocar ›</button></div><div class="atalhos">' + meusAtalhos().map((k) => '<button data-go="' + k + '"><span aria-hidden="true">' + ATALHOS[k][0] + '</span><span>' + ATALHOS[k][1] + '</span></button>').join('') + '</div></section>';
}
function formAtalhos(){
  let sel = meusAtalhos().slice();
  const lista = () => atalhosValidos().map((k) => { const i = sel.indexOf(k); return '<button type="button" data-at="' + k + '" aria-pressed="' + (i >= 0) + '"' + (i >= 0 ? ' data-ordem="' + (i + 1) + '"' : '') + '><span aria-hidden="true">' + ATALHOS[k][0] + '</span><span>' + ATALHOS[k][1] + '</span></button>'; }).join('');
  sheet('<h3>⚡ Meus atalhos</h3><p class="sub" style="margin:-4px 0 12px">Escolha 3 para a tela inicial. A ordem de escolha é a ordem na tela.</p><div class="atpick" id="at-lista"></div><div class="note" id="at-nota" style="margin:12px 0" aria-live="polite"></div><button class="btn pri block" id="at-ok">Salvar</button>', (root) => {
    const desenha = () => {
      const box = $('#at-lista'); box.innerHTML = lista(); box.classList.toggle('cheio', sel.length === 3);
      $('#at-nota').textContent = sel.length === 3 ? '✅ Pronto! Toque em Salvar.' : 'Escolhidos: ' + sel.length + ' de 3.';
      $('#at-ok').disabled = sel.length !== 3; $('#at-ok').style.opacity = sel.length === 3 ? '' : '.5';
      box.querySelectorAll('[data-at]').forEach((b) => b.onclick = () => {
        const k = b.dataset.at, i = sel.indexOf(k);
        if (i >= 0) sel.splice(i, 1);
        else if (sel.length < 3) sel.push(k);
        else { $('#at-nota').textContent = 'Você já escolheu 3. Toque em um marcado para tirar.'; return; }
        desenha();
      });
    };
    desenha();
    $('#at-ok').onclick = () => { if (sel.length !== 3) return; S.perfil.atalhos = sel.slice(); S.perfilUpd = Date.now(); fechar(); save(); toast('⚡ Atalhos salvos!'); };
  });
}

  const lista = [
    { k: 'renda', t: 'Cadastrar minha renda', s: 'Ela entra sozinha todo mês', ok: (S.rendas || []).length > 0 || L.some((l) => l.tipo === 'entrada') },

    { k: 'orcamento', t: 'Definir o orçamento do mês', s: 'Eu aviso antes de estourar', ok: S.perfil.orcamento > 0 },

function guiaIr(i){

function guiaPosicionar(){
  const luz = $('#gui-luz'), box = $('#gui-box'); if (!guia || !luz) return;

  if (!alvo) { luz.className = 'gui-luz sem'; luz.removeAttribute('style'); box.style.top = Math.max(m, (H - alto) / 2) + 'px'; return; }

  const abaixo = r.bottom + folga + m, acima = r.top - folga - m - alto;

}

const num = (v) => { if (typeof v === 'number') return Math.min(v, C.LIMITE_VALOR); const s = String(v || '').trim().replace(/[^\d,.-]/g, ''); if (!s) return 0; const n = /,/.test(s) ? s.replace(/\./g, '').replace(',', '.') : (/^\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g, '') : s); return Math.min(Math.round(parseFloat(n) * 100) / 100 || 0, C.LIMITE_VALOR); };
// limites: textos até 150 caracteres; valores até R$ 99.000.000,00
function limitarCampos(root){
  (root || document).querySelectorAll('input, textarea').forEach((i) => {
    const tipo = (i.getAttribute('type') || 'text').toLowerCase();
    if (['password', 'date', 'time', 'month', 'number', 'color', 'checkbox', 'file', 'hidden'].includes(tipo) || i.readOnly) return;
    if (i.getAttribute('inputmode') === 'decimal') {
      i.maxLength = 15;
      if (!i.dataset.lim) { i.dataset.lim = '1'; i.dataset.ok = i.value; i.addEventListener('input', () => { const v = String(i.value).replace(/[^\d,.]/g, ''); const n = /,/.test(v) ? parseFloat(v.replace(/\./g, '').replace(',', '.')) : parseFloat(v.replace(/\.(?=\d{3}(\D|$))/g, '')); if (n > C.LIMITE_VALOR) { i.value = i.dataset.ok; toast('O valor máximo é R$ 99.000.000,00'); } else i.dataset.ok = i.value; }); }
    } else if (!i.maxLength || i.maxLength < 0 || i.maxLength > 150) i.maxLength = (i.id === 'ln-s' || i.id === 'ln-s2') ? 128 : 150;
  });
  (root || document).querySelectorAll('input[inputmode="tel"]').forEach((i) => { i.maxLength = 20; });
}

function baixarArquivo(nome, txt){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function backupExport(){

utton>') + '<button class="btn pri" type="submit">Salvar</button></div></form>', (root) => {

function formTicket(t){

  sheet('<h3>' + (novo ? '🎟️ Novo Ticket' : '✎ ' + esc(t.nome)) + '</h3><form id="ftn"><div class="field"><label for="tn-n">Nome do cartão</label><input id="tn-n" value="' + esc(t ? t.nome : (S.tickets || []).length ? '' : C.NOME_TICKET) + '" placeholder="Ticket, Alelo, VR, Caju…" required></div><div class="field"><label>Cor</label><div class="chips" id="tn-cor">' + cores.map((x) => '<button type="button" data-cor="' + x + '" style="width:36px;height:36px;padding:0;flex:none;background:' + x + ';border:3px solid ' + (x === cor ? 'var(--ink)' : 'transparent') + '" aria-label="Cor"></button>').join('') + '</div></div><div class="note" style="margin-bottom:12px">💡 O crédito soma no saldo e cada compra desconta. Nada disso muda o saldo do mês.</div><div class="btnrow">' + (novo ? '' : '<button type="button" class="btn danger" id="tn-x">🗑️ Excluir</button>') + '<button class="btn pri" type="submit">Salvar</button></div></form>', (root) => {

function sairLocal(){ token = ''; conta = null; try { localStorage.removeItem('cc-token'); localStorage.removeItem(KEY); } catch(e){} mem = null; S = C.estadoVazio(); S.demo = true; render(); telaEntrar('entrar'); }
function blocoConta(){
  if (!SERVER) return '<section class="card"><h2 style="margin-bottom:8px">🔐 Minha conta</h2><div class="note">Nesta demonstração os dados ficam só neste aparelho. No app publicado você entra com <b>WhatsApp + senha</b> e seus dados ficam protegidos e sincronizados entre aparelhos.</div></section>';
  if (!conta) return '';
  return '<section class="card"><h2 style="margin-bottom:8px">🔐 Minha conta</h2><div class="list"><div class="item"><span class="ico" style="background:var(--tile-in)">📱</span><span class="mid"><span class="ttl">+' + esc(conta.fone) + '</span><span class="meta">' + (conta.verificado ? 'WhatsApp confirmado ✓' : cfg.demo ? 'Número de contato' : 'WhatsApp aguardando confirmação') + '</span></span></div>' + (conta.email ? '<div class="item"><span class="ico" style="background:var(--tile-bal)">✉️</span><span class="mid"><span class="ttl">' + esc(conta.email) + '</span><span class="meta">E-mail de acesso</span></span></div>' : '') + '<div class="item"><span class="ico" style="background:var(--tile-dream)">📅</span><span class="mid"><span class="ttl">Plano ' + esc(conta.planoNome || 'Ilimitado') + '</span><span class="meta">' + (conta.validade ? 'Válido até ' + C.dataBR(conta.validade) + ' (' + conta.dias + ' dias)' : 'Sem data de vencimento') + '</span></span></div></div>' + botaoInstalar('background:var(--surface-2);margin-top:8px') + '<div class="btnrow" style="margin-top:8px"><button class="btn ghost" id="ct-senha">🔑 ' + (conta.temSenha ? 'Trocar senha' : 'Criar senha') + '</button><button class="btn ghost" id="ct-sair">🚪 Sair</button></div><button class="btn danger block" style="margin-top:8px" id="ct-todos">Sair de todos os aparelhos</button></section><section class="card"><h2 style="margin-bottom:8px">🛡️ Meus dados e privacidade</h2><div class="btnrow"><button class="btn ghost" id="ct-json">⬇️ Baixar tudo</button><button class="btn ghost" id="ct-csv">📊 Lançamentos (Excel)</button></div><div class="sub" style="margin-top:10px"><a href="/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a> · <a href="/termos.html" target="_blank" rel="noopener">Termos de Uso</a></div>' + (conta.admin ? '' : '<button class="btn danger block" style="margin-top:10px" id="ct-excluir">🗑️ Excluir minha conta</button>') + '</section>';
}
async function baixarDados(fmt){
  try {
    const r = await fetch('/api/meus-dados' + (fmt === 'csv' ? '?formato=csv' : ''), { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw 0;
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href = url; a.download = fmt === 'csv' ? 'sonhai-lancamentos.csv' : 'sonhai-meus-dados.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('⬇️ Download iniciado');
  } catch(e){ toast('Não consegui baixar agora. Tente de novo.'); }
}
function formExcluirConta(){
  sheet('<h3>🗑️ Excluir minha conta</h3><p>Isso apaga seus lançamentos, contas, sonhos e compromissos, sem volta. As cópias de segurança somem em até 3 dias.</p><p class="sub">Se quiser guardar uma cópia, baixe seus dados antes.</p><form id="fdel">' + (conta.temSenha ? '<div class="field"><label for="del-s">Digite sua senha para confirmar</label><input id="del-s" type="password" autocomplete="current-password" required></div>' : '') + '<div class="note" id="del-e" hidden style="color:var(--bad);margin-bottom:10px"></div><button class="btn danger block" type="submit">Excluir para sempre</button></form>', () => {
    $('#fdel').onsubmit = async (e) => { e.preventDefault(); const er = $('#del-e'); er.hidden = true; try { await api('/api/excluir-conta', { senha: $('#del-s') ? $('#del-s').value : '' }); fechar(); sairLocal(); toast('🗑️ Sua conta foi excluída. Foi um prazer! 💙'); } catch(x){ er.textContent = x.message; er.hidden = false; } };
  });
}
function formAceite(){
  sheet('<h3>📄 Termos e Privacidade</h3><p>Para continuar, leia e aceite os <a href="/termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a> do Sonhaí.</p><button class="btn pri block" id="ace-ok">Li e aceito</button>', () => {
    $('#ace-ok').onclick = async () => { try { await api('/api/aceite', {}); conta.aceite = true; proximoAcesso(); } catch(x){ toast(x.message); } };
  }, { fixa: true });
}
/** Acesso vencido: a pessoa ainda entra para renovar, baixar ou excluir os dados. */
function telaVencida(){
  const sup = (conta.suporte || cfg.suporte || '').replace(/\D/g, '');
  const L = $('#layer');
  L.innerHTML = '<div class="ob" role="dialog" aria-modal="true"><div class="box"><span class="logo" style="width:64px;height:64px;border-radius:20px;background:var(--sun);display:grid;place-items:center">' + LOGO.replace(/22/g, '38') + '</span><h1>Seu acesso venceu</h1><p>Plano ' + esc(conta.planoNome || '') + (conta.validade ? ' até ' + C.dataBR(conta.validade) : '') + '. Seus dados estão guardados e serão apagados em <b>' + Math.max(0, conta.apagaEm) + ' dias</b>, se o acesso não for renovado.</p>' + botaoRenovar(sup) + '<button class="btn block" id="ve-json" style="background:rgba(255,255,255,.14);color:inherit">⬇️ Baixar meus dados</button><button class="btn block" id="ve-csv" style="background:rgba(255,255,255,.14);color:inherit">📊 Baixar lançamentos (Excel)</button><button class="btn block" id="ve-del" style="background:rgba(255,255,255,.14);color:inherit">🗑️ Excluir minha conta</button><button class="btn block" id="ve-sair" style="background:transparent;color:inherit;text-decoration:underline">Sair</button></div></div>';
  $('#ve-json').onclick = () => baixarDados('json');
  $('#ve-csv').onclick = () => baixarDados('csv');
  $('#ve-del').onclick = () => { L.innerHTML = ''; formExcluirConta(); };
  $('#ve-sair').onclick = () => sair(false);
}
function palavraDoDia(){
  if (S.perfil.versiculo === false) return '';
  let fechado = ''; try { fechado = localStorage.getItem('cc-versiculo') || ''; } catch(e){}
  if (fechado === hojeISO()) return '';
  const v = C.versiculoDoDia(hoje());
  return '<section class="card versiculo" aria-label="Palavra do dia"><div class="cardhead" style="margin-bottom:6px"><h2 style="font-size:17px">📖 Palavra do dia</h2><button class="iconbtn" id="vers-x" style="background:transparent;color:var(--ink-2);width:32px;height:32px" aria-label="Fechar por hoje">✕</button></div><p class="vtxt">“' + esc(v.texto) + '”</p><p class="vref">' + esc(v.ref) + '</p></section>';
}
function avisoPlano(){
  if (!conta || conta.dias == null || conta.dias > 5) return '';
  const sup = (conta.suporte || '').replace(/\D/g, '');
  return '<section class="card" style="background:var(--tile-out)"><h2 style="font-size:18px">⏳ Seu acesso vence ' + (conta.dias <= 0 ? 'hoje' : 'em ' + conta.dias + (conta.dias === 1 ? ' dia' : ' dias')) + '</h2><p style="margin:8px 0">Plano ' + esc(conta.planoNome) + ' até ' + C.dataBR(conta.validade) + '. Renove para continuar usando o Sonhaí sem interrupção.</p>' + botaoRenovar(sup) + '</section>';
}
function botaoRenovar(sup){
  if (cfg.assinatura) return '<a class="btn sun block" href="' + esc(cfg.assinatura) + '" target="_blank" rel="noopener">💳 Renovar agora</a>';
  return sup ? '<a class="btn sun block" href="https://wa.me/' + sup + '?text=' + encodeURIComponent('Olá! Quero renovar meu acesso ao Sonhaí.') + '" target="_blank" rel="noopener">💬 Renovar pelo WhatsApp</a>' : '';
}
function avisoLembretes(){
  if (!SERVER || !conta || conta.canal || conta.expirado || !cfg.telegram || S.perfil.guiaPassos) return '';
  return '<section class="card" style="background:var(--tile-dream)"><h2 style="font-size:18px">🔔 Ative seus lembretes</h2><p style="margin:8px 0">Conecte o Telegram para receber as contas e os compromissos no celular, sem custo.</p><button class="btn sun block" data-go="whatsapp">Ativar agora</button></section>';
}
function avisoVerificar(){
  if (!conta || conta.verificado || cfg.demo) return '';
  const msg = 'SONHAI ' + conta.codigo;
  return '<section class="card" style="background:var(--tile-dream)"><h2 style="font-size:18px">📲 Falta só confirmar seu WhatsApp</h2><p style="margin:8px 0">Mande a mensagem <b class="num" style="font-size:18px">' + msg + '</b> para o Sonhaí' + (cfg.whatsapp ? ' no número <b>' + esc(cfg.whatsapp) + '</b>' : '') + '. Assim você lança gastos e recebe lembretes por lá.</p>' + (cfg.whatsapp ? '<a class="btn sun block" href="https://wa.me/' + esc(cfg.whatsapp.replace(/\D/g, '')) + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Abrir WhatsApp</a>' : '') + '</section>';
}

// ------------------------------------------------------------ início
const h0 = (location.hash || '').slice(1); if (TELAS[h0]) view.tela = h0;
window.addEventListener('popstate', () => { if (ignorarPop) { ignorarPop = false; return; } if (guia) { try { history.pushState({ g: 1 }, '', location.hash); } catch(e){} guiaIr(guia.i - 1); return; } if (sheetAberta) { if (sheetFixa) { try { history.pushState({ s: 1 }, '', location.hash); } catch(e){} return; } fechar(true); return; } profundidade = Math.max(0, profundidade - 1); const x = location.hash.slice(1) || 'inicio'; if (TELAS[x] && x !== view.tela) { fechar(); view.tela = x; render(); scrollTo(0, 0); } });
window.addEventListener('hashchange', () => { const x = location.hash.slice(1); if (TELAS[x] && x !== view.tela) { view.tela = x; render(); } });
render();
if (SERVER) {
  (async () => {
    try { cfg = await (await fetch('/api/config')).json(); } catch(e){}
    if (codAcesso) { try { infoAcesso = await (await fetch('/api/acesso?c=' + encodeURIComponent(codAcesso))).json(); if (infoAcesso.erro) { toast(infoAcesso.erro); infoAcesso = null; } else { token = ''; try { localStorage.removeItem('cc-token'); } catch(e){} } } catch(e){} }
    if (codEntrada) { try { const j = await api('/api/entrar', { codigo: codEntrada }); token = j.token; localStorage.setItem('cc-token', token); localStorage.removeItem(KEY); } catch(e){ toast(e.message); } }
    if (token) iniciarConta(true); else telaEntrar('entrar');
  })();
}
if (SERVER && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('/sw.js').catch(() => {}); } catch(e){} }
})();
