<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Sonhaí: controle financeiro por voz e WhatsApp, com lembretes de contas e metas de sonhos.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<!--CC_SERVER--></head><body>
<title>Sonhaí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1B3A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: app de celular (coluna única de até 560px), barra inferior com microfone central; blocos coloridos por assunto */
:root{
  --bg:#EEF3FA; --surface:#FFFFFF; --surface-2:#F5F8FD; --ink:#13233A; --ink-2:#4A5B74; --line:#DCE4F0;
  --navy:#1B3A6B; --sun:#FFC83D; --sun-ink:#5A4000; --coral:#FF6B5B; --leaf:#16B47D; --sky:#2F80ED; --grape:#7B5CFA; --pink:#F0569A;
  --good:#11A36F; --warn:#E59A00; --bad:#E5484D;
  --tile-in:#E3F7EE; --tile-out:#FFE9E5; --tile-dream:#FFF4D1; --tile-bal:#E6EEFF;
  --shadow:0 1px 2px rgba(19,35,58,.06),0 8px 24px rgba(19,35,58,.07);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1522; --surface:#152132; --surface-2:#1B2A3F; --ink:#EAF1FB; --ink-2:#A7B6CC; --line:#26374F;
  --navy:#8DB4FF; --sun:#FFCF52; --sun-ink:#2B1F00; --coral:#FF8072; --leaf:#2FD198; --sky:#5C9DFF; --grape:#9A82FF; --pink:#FF77B2;
  --good:#2FD198; --warn:#FFB938; --bad:#FF6B6F;
  --tile-in:#123629; --tile-out:#3A1F1E; --tile-dream:#3A3012; --tile-bal:#18294A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1522; --surface:#152132; --surface-2:#1B2A3F; --ink:#EAF1FB; --ink-2:#A7B6CC; --line:#26374F;
  --navy:#8DB4FF; --sun:#FFCF52; --sun-ink:#2B1F00; --coral:#FF8072; --leaf:#2FD198; --sky:#5C9DFF; --grape:#9A82FF; --pink:#FF77B2;
  --good:#2FD198; --warn:#FFB938; --bad:#FF6B6F;
  --tile-in:#123629; --tile-out:#3A1F1E; --tile-dream:#3A3012; --tile-bal:#18294A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{background:var(--navy);color:#fff;padding-block:14px 56px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
:root[data-theme="dark"] .top{color:#0D1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{color:#0D1522}}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.2px}
.brand .logo{width:36px;height:36px;border-radius:12px;background:var(--sun);display:grid;place-items:center;flex:none}
.hello{margin-top:16px;font-size:15px;opacity:.85}
.hello b{font-family:var(--f-display);font-size:26px;display:block;opacity:1;font-weight:700;line-height:1.15}
.top .blob{position:absolute;border-radius:50%;opacity:.16;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;font-size:19px}
.monthsel{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.monthsel button{border:0;background:transparent;color:inherit;width:32px;height:32px;border-radius:50%;font-size:16px}
.monthsel span{font-weight:700;font-size:14px;min-width:84px;white-space:nowrap;text-align:center;text-transform:capitalize}

.demo{margin:-40px 16px 0;position:relative;z-index:2;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.demo button{margin-left:auto;border:0;background:var(--sun-ink);color:var(--sun);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.demo + .content{margin-top:12px}
.content{margin-top:-40px;position:relative;z-index:1;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--ink-2);font-size:14px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{border:0;background:none;color:var(--sky);font-weight:800;font-size:14px;padding:6px 0}

/* herói do mês */
.hero{padding:18px}
.hero .lbl{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin:6px 0 4px}
.hero .big.neg{color:var(--bad)} .hero .big.pos{color:var(--good)}
.mood{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:600;font-size:15px}
.mood.good{background:var(--tile-in)} .mood.warn{background:var(--tile-dream)} .mood.bad{background:var(--tile-out)}
.meter{margin-top:14px}
.meter .bar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter .fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px;gap:8px;flex-wrap:wrap}

.versiculo{background:linear-gradient(135deg,var(--tile-bal),var(--tile-dream))}
.versiculo .vtxt{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35;margin:0}
.versiculo .vref{margin:6px 0 0;font-weight:800;color:var(--ink-2);font-size:14px}
.olho{border:0;background:var(--surface-2);color:var(--ink);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.disp{margin-top:8px;font-size:15px}
.voltar{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:inherit;font-size:26px;line-height:1;display:grid;place-items:center;flex:none;margin-right:8px}
.hello.comvoltar{display:flex;align-items:center}
.pago{color:var(--good);font-weight:800}
.sheetvoltar{border:0;background:var(--surface-2);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:14px;min-width:0;border:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .t{font-size:13px;font-weight:800;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--ink-2)}
.t-in{background:var(--tile-in)} .t-out{background:var(--tile-out)} .t-dream{background:var(--tile-dream)} .t-bal{background:var(--tile-bal)}

/* listas */
.list{display:grid;gap:2px;grid-template-columns:minmax(0,1fr)}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:14px;border:0;background:transparent;text-align:left;width:100%}
.item:hover{background:var(--surface-2)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0;display:block}
.item .mid > span{display:block}
.item .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:800;white-space:nowrap}
.val.out{color:var(--ink)} .val.in{color:var(--good)}
.daylbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:12px 4px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.ok{background:var(--tile-in);color:var(--good)} .chip.warn{background:var(--tile-dream);color:var(--warn)} .chip.bad{background:var(--tile-out);color:var(--bad)} .chip.info{background:var(--tile-bal);color:var(--sky)}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;flex:none}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.empty{text-align:center;color:var(--ink-2);padding:18px 8px;font-size:15px}
.empty .e{font-size:34px;display:block;margin-bottom:4px}

/* donut + categorias */
.donutwrap{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}
.donutwrap > *{min-width:0}
@media (max-width:380px){.donutwrap{grid-template-columns:1fr}.donutwrap svg{margin:0 auto}}
.catrow{display:grid;gap:4px;margin-bottom:10px;grid-template-columns:minmax(0,1fr)}
.catrow .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.catrow .h span:last-child{flex:none}
.catrow .h span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .b{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.catrow .b i{display:block;height:100%;border-radius:999px}

/* sonhos */
.dreams{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,72%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -4px;padding-inline:4px}
.dream{scroll-snap-align:start;border-radius:18px;padding:14px;background:var(--tile-dream);display:grid;gap:8px;border:0;text-align:left;min-width:0}
.dream .top2{display:flex;gap:10px;align-items:center}
.ring{width:56px;height:56px;flex:none}
.dream .n{font-weight:800;font-size:16px;line-height:1.2}
.dream .s{font-size:13px;color:var(--ink-2)}
.pbar{height:10px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:999px}
.dreamcard{display:grid;gap:10px}
.dreamcard .row{display:flex;gap:12px;align-items:center}
.dreamcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dreamcard .stats div{background:var(--surface-2);border-radius:12px;padding:8px;min-width:0}
.dreamcard .stats b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dreamcard .stats small{font-size:11.5px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.quote{background:linear-gradient(135deg,var(--tile-dream),var(--tile-out));border-radius:16px;padding:14px;font-weight:700;display:flex;gap:10px;align-items:center}

/* botões */
.btn{text-decoration:none;border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--navy);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--tile-out);color:var(--bad)}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.addbtn{border:0;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}

/* abas internas */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chips button.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);pointer-events:none}
.nav .in{max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;pointer-events:auto;box-shadow:0 -6px 24px rgba(19,35,58,.08);border-radius:22px 22px 0 0}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 12px;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.nav button .i{font-size:22px;line-height:1;filter:grayscale(.6);opacity:.8}
.nav button.on{color:var(--navy)} .nav button.on .i{filter:none;opacity:1}
.nav .micwrap .mic{padding:0;position:relative;top:-22px;width:72px;height:72px;border-radius:50%;margin:0 auto;background:var(--coral);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,107,91,.45);border:5px solid var(--bg);filter:none}
.nav .micwrap{padding:0;display:flex;flex-direction:column;align-items:center;height:64px}
.nav .micwrap small{position:relative;top:-18px;font-weight:800;color:var(--coral)}

/* folha (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,18,32,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92%;overflow:auto;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:24px;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:17px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{font-family:var(--f-display);font-size:28px!important;font-weight:700}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catpick button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 2px;display:grid;gap:2px;justify-items:center;font-size:11px;font-weight:700;line-height:1.15;min-width:0}
.catpick button span:first-child{font-size:22px}
.catpick button.on{border-color:var(--navy);background:var(--tile-bal)}
.catpick button span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}

/* voz */
.voice{text-align:center;display:grid;gap:14px;justify-items:center}
.bigmic{width:120px;height:120px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:50px;display:grid;place-items:center;position:relative;box-shadow:0 12px 30px rgba(255,107,91,.4)}
.bigmic.rec::before,.bigmic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--coral);animation:pulse 1.4s ease-out infinite}
.bigmic.rec::after{animation-delay:.7s}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
.transcript{min-height:52px;font-size:19px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
.hint{font-size:14px;color:var(--ink-2)}
.examples{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.examples button{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.typebox{display:flex;gap:8px;width:100%}
.typebox input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px}
.result{width:100%;text-align:left;background:var(--surface-2);border-radius:18px;padding:14px;display:grid;gap:10px;border:2px solid var(--leaf)}
.result .msg{white-space:pre-line;font-weight:600}

/* whatsapp */
.wa{background:#E7DDD3;border-radius:18px;padding:12px;display:grid;gap:8px;max-height:420px;overflow:auto}
:root[data-theme="dark"] .wa{background:#0B141A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{background:#0B141A}}
.bub{max-width:85%;padding:8px 11px;border-radius:12px;font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.12);color:#111B21}
.bub.me{justify-self:end;background:#D9FDD3;border-top-right-radius:4px}
.bub.bot{justify-self:start;background:#FFFFFF;border-top-left-radius:4px}
:root[data-theme="dark"] .bub{color:#E9EDEF} :root[data-theme="dark"] .bub.me{background:#005C4B} :root[data-theme="dark"] .bub.bot{background:#202C33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub{color:#E9EDEF}:root:not([data-theme="light"]) .bub.me{background:#005C4B}:root:not([data-theme="light"]) .bub.bot{background:#202C33}}
.bub small{display:block;text-align:right;font-size:10.5px;opacity:.6;margin-top:2px}
.wahead{display:flex;align-items:center;gap:10px;background:#008069;color:#fff;border-radius:18px 18px 0 0;padding:10px 12px;margin-bottom:-8px}
.wahead .av{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between;width:calc(100% - 32px);max-width:520px;box-shadow:var(--shadow);animation:up .25s ease}
.toast button{border:0;background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:6px 10px;font-weight:800}
.atalhos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.atalhos button{border:0;border-radius:18px;padding:14px 6px;display:grid;justify-items:center;gap:6px;font-weight:800;font-size:13.5px;background:var(--surface-2);color:var(--ink);min-width:0;min-height:88px;align-content:center}
.atalhos button span:first-child{font-size:30px;line-height:1}

        if (/\bdia\s*$|\/\s*$|:\s*$|\bas\s*$/.test(antes)) continue;
        if (/\d\s*h\s*$/.test(antes)) continue;
        if (UNIDADES.test(depois)) continue;
        if (/\bparcel\w*\b/.test(t) && /\bem\s*$/.test(antes)) continue;
      }
      let valor = paraNumero(bruto), trecho = x[0];
      if (!isFinite(valor)) continue;
      // "52 e 90" -> 52,90
      if (!comMoeda && /^\d+$/.test(bruto)) {
        const d = depois.match(/^\s*e\s+(\d{2})(?!\d)/);
        if (d && LIGACAO.test(depois.slice(d[0].length))) { valor += +d[1] / 100; trecho = x[0] + d[0]; re.lastIndex += d[0].length; }
      }
      // pontuação: moeda > palavra de preço > número solto > número seguido de substantivo ("3 pizzas")
      let pts = comMoeda ? 10 : 0;
      const qtd = !comMoeda && !LIGACAO.test(t.slice(pos + trecho.length));
      if (!comMoeda) {
        if (/\b(por|custou|custa|deu|foi|ficou|saiu|valor|total|de)\s*$/.test(antes)) pts += 3;
        else if (/\b(gastei|gastamos|paguei|pagamos|gasto|pago)\s*$/.test(antes)) pts += 2;
        if (qtd) pts -= 3;
      }
      const cand = { valor, trecho, moeda: comMoeda, pos, pts, plural: qtd && /\b(comprei|compramos|comprou)\s*$/.test(antes) && /^\s*[a-z]+s\b/.test(t.slice(pos + trecho.length)) };
      if (!melhor || cand.pts > melhor.pts || (cand.pts === melhor.pts && !cand.moeda)) melhor = cand;
    }
    if (melhor && melhor.plural) return null; // "comprei 3 pizzas": sem preço
    if (melhor) return melhor;
    if (m) return { valor: +m[1] / 100, trecho: m[0] };
    return null;
  }

  // --------------------------------------------------------- datas e horas
  const DIAS_SEMANA = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
  const MESES_SEM = MESES.map(sem);
  /** modo 'passado' (gastos e entradas) olha para trás; 'futuro' (compromissos) olha para a frente. */
  function extrairData(t, hoje, modo) {
    const futuro = modo !== 'passado';
    const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
    const add = (n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
    const dt = (y, mes, dia) => new Date(y, mes, Math.min(dia, new Date(y, mes + 1, 0).getDate()));
    /** Sem ano informado: escolhe o ano que faz sentido para o modo. */
    const noAno = (mes, dia) => {
      const y = d.getFullYear(); const r = dt(y, mes, dia);
      if (futuro) return r < add(-60) ? dt(y + 1, mes, dia) : r;
      return r > d ? dt(y - 1, mes, dia) : r;
    };
    if (/depois de amanha/.test(t)) return { data: iso(add(2)), trecho: 'depois de amanha' };
    if (/anteontem/.test(t)) return { data: iso(add(-2)), trecho: 'anteontem' };
    if (/\bontem\b/.test(t)) return { data: iso(add(-1)), trecho: 'ontem' };
    if (/\bamanha\b/.test(t)) return { data: iso(add(1)), trecho: 'amanha' };
    if (/\bhoje\b/.test(t)) return { data: iso(d), trecho: 'hoje' };
    let m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (m && +m[2] >= 1 && +m[2] <= 12) {
      if (m[3]) { let y = +m[3]; if (y < 100) y += 2000; return { data: iso(dt(y, +m[2] - 1, +m[1])), trecho: m[0] }; }
      return { data: iso(noAno(+m[2] - 1, +m[1])), trecho: m[0] };
    }
    m = t.match(/\bdia\s+(\d{1,2})(?:\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro))?/);
    if (m) {
      const dia = +m[1];
      if (m[2]) return { data: iso(noAno(MESES_SEM.indexOf(m[2]), dia)), trecho: m[0], dia };
      // sem mês: "dia 3" já passou? compromisso vai para o mês que vem; "dia 28" ainda não chegou? gasto foi no mês passado
      let r = dt(d.getFullYear(), d.getMonth(), dia);
      if (futuro && r < d) r = dt(d.getFullYear(), d.getMonth() + 1, dia);
      if (!futuro && r > d) r = dt(d.getFullYear(), d.getMonth() - 1, dia);
      return { data: iso(r), trecho: m[0], dia };
    }
    m = t.match(/\b(\d{1,2})\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/);
    if (m) return { data: iso(noAno(MESES_SEM.indexOf(m[2]), +m[1])), trecho: m[0] };
    for (let i = 0; i < 7; i++) {
      const re = new RegExp('\\b(?:na |no |nessa |nesta |proxima |proximo |ultima |ultimo )?' + DIAS_SEMANA[i] + '(?:-feira| feira)?\\b(?!\\s+(?:parcela|via|vez|mao|prestacao))');
      const mm = t.match(re);
      if (mm) {
        let n = (i - d.getDay() + 7) % 7;
        const passado = /\b(passad[oa]|ultim[oa])\b/.test(t), proximo = /\b(proxim[oa]|que vem)\b/.test(t);
        if (passado || (!futuro && !proximo)) n = n === 0 ? -7 : n - 7;
        else if (n === 0) n = 7;
        return { data: iso(add(n)), trecho: mm[0] };
      }
    }
    return null;
  }
  function extrairHora(t) {
    let m = t.match(/\b(?:as|às|a partir das|por volta das)?\s*(\d{1,2})[:h](\d{2})\b/);
    if (m && +m[1] < 24) return { hora: pad(+m[1]) + ':' + m[2], trecho: m[0] };
    m = t.match(/\b(?:as|às)\s*(\d{1,2})\s*(?:h|horas?)?(?:\s*e\s*(meia|\d{1,2}))?(?:\s*da\s*(manha|tarde|noite))?/);
    if (!m) m = t.match(/\b(\d{1,2})\s*(?:h|horas)\b(?:\s*e\s*(meia|\d{1,2}))?(?:\s*da\s*(manha|tarde|noite))?/);
    if (m) {
      let h = +m[1]; let min = m[2] === 'meia' ? 30 : (m[2] ? +m[2] : 0);
      if ((m[3] === 'tarde' || m[3] === 'noite') && h < 12) h += 12;
      if (h < 24) return { hora: pad(h) + ':' + pad(min), trecho: m[0] };
    }
    if (/\bmeio dia\b/.test(t)) return { hora: '12:00', trecho: 'meio dia' };
    return null;
  }

  function adivinharCategoria(t, cats) {
    const lista = cats && cats.length ? cats : CATEGORIAS;
    let melhor = null, tam = 0;
    const tt = ' ' + t.replace(/caixa eletronico/g, ' ') + ' ';
    for (const c of lista) {
      const base = CATEGORIAS.find((x) => x.nome === c.nome);
      const chaves = (c.chaves || (base && base.chaves) || []).concat([sem(c.nome)]);
      for (const k of chaves) {
        if (!k) continue;
        if (tt.includes(k.length <= 4 ? ' ' + k.trim() + ' ' : k) && k.length > tam) { melhor = c.nome; tam = k.length; }
      }
    }
    return melhor || 'Outros';
  }

  const VERBOS = /\b(gastei|gastamos|gastar|gaste|despesa|despesas|saida|torrei|desembolsei|comprar|compramos|pagamos|criar|cria|crie|novo|nova|lancamento|registro|incluir|inclui|inclua|bota|botar|gastei|paguei|comprei|almocei|jantei|abasteci|coloquei|botei|lancei|lanca|lancar|lance|anota|anotar|anote|registra|registrar|registre|adiciona|adicionar|adicione|foi|deu|custou|tive um gasto de|tive gasto de|gasto de|gasto|compra de|compra|fiz|fui|no valor de|valor de|reais|real|conto|contos|pila|r\$|com|de|do|da|no|na|em|um|uma|o|a|os|as|e|pra|para|pro|hoje|ontem|anteontem|agora|cartao|credito|debito|pix|dinheiro|no cartao|eu|me|meu|minha)\b/g;
  function limparDescricao(original, remover) {
    let t = ' ' + extensoParaNumero(sem(original)) + ' ';
    const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    for (const r of remover) if (r) t = t.replace(new RegExp('(^|[^a-z0-9])' + esc(sem(r).trim()) + '(?=[^a-z0-9]|$)', 'g'), '$1 ');
    t = t.replace(/[.,!?;]/g, ' ').replace(VERBOS, ' ').replace(/\b\d+\b/g, ' ').replace(/\s+/g, ' ').trim();
    if (!t) return '';
    // reaproveita grafia original (com acentos) quando possível
    const palavras = t.split(' ');
    const orig = String(original).split(/\s+/);
    const res = palavras.map((p) => orig.find((o) => sem(o).replace(/[.,!?;]/g, '') === p) || p).map((p) => p.replace(/[.,!?;]/g, ''));
    const s = res.join(' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  const pagamento = (t) => (/credito|cartao/.test(t) ? 'Cartão' : /\bpix\b/.test(t) ? 'Pix' : /debito/.test(t) ? 'Débito' : /dinheiro|especie/.test(t) ? 'Dinheiro' : '');

  // ------------------------------------------------------- conversa com perguntas
  /** Interpreta e aplica; se havia uma pergunta pendente, resolve primeiro. Exclusões sempre pedem confirmação. */
  function conversar(estado, texto, opts) {
    opts = opts || {};
    const hoje = opts.hoje || new Date();
    const p = estado.pendente;
    if (p && Date.now() - (p.em || 0) < 15 * 60e3) {
      const t = sem(texto).trim();
      if (/^(cancela|cancelar|deixa|deixa pra la|nao|n|esquece)\b/.test(t)) { delete estado.pendente; return { ok: true, msg: p.tipo === 'excluir' ? 'Tudo bem, não excluí nada. 🙂' : 'Tudo bem, não guardei nada. 🙂' }; }
      if (p.tipo === 'excluir') {
        delete estado.pendente;
        if (/^(sim|s|pode|isso|confirmo|confirmar|ok|exclui|excluir|apaga|apagar)\b/.test(t)) { const r = aplicar(estado, p.acao, opts); r.acao = p.acao; return r; }
      } else if (p.tipo === 'sonho' && !extrairValor(t.replace(/^\d{1,2}$/, '')) && !/\b(gastei|paguei|comprei|recebi)\b/.test(t)) {
        delete estado.pendente;
        const n = t.match(/^(\d{1,2})\.?$/);
        const lista = estado.sonhos || [];
        const alvo = n ? lista[+n[1] - 1] : acharSonho(lista, t);
        const acao = { tipo: 'sonho', valor: p.valor, data: p.data, investir: p.investir, sonhoId: alvo ? alvo.id : undefined, termo: alvo ? '' : String(texto).trim().replace(/^(novo|criar|cria|sonho|um sonho)\s+/i, '') };
        if (!alvo && n) return { ok: false, msg: 'Não achei esse número. Responda de novo, por favor. 🙂', pergunta: p };
        return aplicar(estado, acao, opts);
      } else if (p.tipo === 'valor' && extrairValor(extensoParaNumero(t))) {
        delete estado.pendente;
        return conversar(estado, p.texto + ' ' + texto, opts);
      }
    }
    delete estado.pendente;
    const ctx = { hoje, categorias: estado.categorias, sonhos: estado.sonhos, cartoes: estado.cartoes, tickets: estado.tickets };
    const varios = separarLancamentos(texto, ctx);
    if (varios) { const rv = lancarVarios(estado, varios, opts); rv.acao = { tipo: 'varios' }; return rv; }
    const acao = interpretar(texto, ctx);
    if (acao.tipo === 'excluir') {
      const alvo = acharExclusao(estado, acao);
      if (!alvo.item) return { ok: false, msg: alvo.msg, acao };
      const pergunta = { tipo: 'excluir', em: Date.now(), acao: Object.assign({}, acao, { alvoCol: alvo.col, alvoId: alvo.item.id }) };
      estado.pendente = pergunta;
      return { ok: false, acao, pergunta, msg: `🗑️ Quer mesmo excluir ${descreverAlvo(alvo)}?\nResponda *sim* ou *não*.` };
    }
    const r = aplicar(estado, acao, opts);
    if (r.pergunta) estado.pendente = r.pergunta;
    r.acao = acao;
    return r;
  }

  /** "gastei 50 no mercado e 30 na padaria" são dois gastos. Só separa com certeza; na dúvida, segue como uma frase. */
  function separarLancamentos(texto, opts) {
    const original = String(texto || '').trim();
    const norm = extensoParaNumero(sem(original));
    if (/\b\d{1,2}\s*(x|vezes|parcelas?)\b/.test(norm)) return null;
    const base = norm === sem(original) ? original : norm; // mantém os acentos quando dá
    let partes = base.split(/\s*[;,]\s+|\s+e\s+|\s+mais\s+|\s+depois\s+/i).map((x) => x.trim()).filter(Boolean);
    if (partes.length < 2) partes = paresSemSeparador(base);
    if (!partes || partes.length < 2 || partes.length > 5) return null;
    const verbo = (base.match(/^\s*(?:eu\s+)?(gastei|gastamos|paguei|pagamos|comprei|compramos|recebi|recebemos|ganhei)\b/i) || [])[1];
    const hoje = opts.hoje || new Date();
    const dataGeral = extrairData(norm, hoje, 'passado');
    const acoes = [];
    for (const p of partes) {
      const frase = verbo && !new RegExp('\\b' + sem(verbo) + '\\b').test(sem(p)) && !/\b(gastei|paguei|comprei|recebi|ganhei)\b/.test(sem(p)) ? verbo + ' ' + p : p;
      const v = extrairValor(extensoParaNumero(sem(frase)));
      if (!v || !(v.moeda || v.pts >= 0)) return null;
      const a = interpretar(frase, opts);
      if (a.tipo !== 'gasto' && a.tipo !== 'entrada') return null;
      if (!a.desc || (a.tipo === 'gasto' && a.cat === 'Outros' && a.desc === 'Outros')) return null;
      if (dataGeral && a.data === iso(hoje)) a.data = dataGeral.data;
      acoes.push(a);
    }
    // "... e 30 na padaria no cartão Nubank": a forma de pagamento citada no fim vale para todos
    const ult = acoes[acoes.length - 1];
    if (ult.tipo === 'gasto' && (ult.cartao || ult.ticket || ult.pagamento)) for (const a of acoes) if (a.tipo === 'gasto' && !a.cartao && !a.ticket && !a.pagamento) { a.cartao = ult.cartao; a.ticket = ult.ticket; a.pagamento = ult.pagamento; if (ult.cartao || ult.ticket) a.paguei = false; }
    return acoes;
  }
  /** "mercado 50 padaria 30": pares de nome e valor, sem verbo, vírgula ou "e". */
  function paresSemSeparador(b) {
    const par = '(?:[^\\d\\s]+\\s+){1,3}\\d+(?:[.,]\\d{1,2})?(?:\\s+reais)?';
    if (!new RegExp('^' + par + '(?:\\s+' + par + ')+$', 'i').test(b)) return null;
    const pares = b.match(new RegExp(par, 'gi')).map((x) => x.trim());
    const tn = sem(b);
    if (/^(gastei|gastamos|paguei|pagamos|comprei|compramos|abasteci)\b/.test(tn)) return null;
    if (pares.some((p) => /\b(para|pra|por|de|com|em|dia|as)\b/.test(sem(p)) || UNIDADES.test(sem(p)))) return null;
    return pares;
  }
  /** Lança tudo de uma vez; "desfazer" volta o conjunto. */
  function lancarVarios(estado, acoes, opts) {
    const rs = acoes.map((a) => aplicar(estado, a, opts));
    const k = rs.filter((r) => r.podeDesfazer).length;
    if (k > 1) {
      const blocos = estado.desfazer.splice(-k);
      const vistos = new Set(); const alterados = [];
      for (const b of blocos) for (const x of b.alterados) { const c = x.col + ':' + x.item.id; if (!vistos.has(c)) { vistos.add(c); alterados.push(x); } }
      estado.desfazer.push({ criados: blocos.flatMap((b) => b.criados), alterados, removidos: blocos.flatMap((b) => b.removidos), rotulo: acoes.length + ' lançamentos', em: Date.now() });
    }
    const linhas = acoes.map((a) => `• ${a.desc && a.desc !== a.cat ? a.desc : a.cat}: ${brl(a.valor)}${a.tipo === 'entrada' ? ' (entrada)' : ''}`);
    const gastos = acoes.filter((a) => a.tipo === 'gasto');
    const aviso = (rs[rs.length - 1].msg || '').split('\n').filter((l) => /orçamento/i.test(l)).pop();
    return { ok: rs.every((r) => r.ok), colecao: 'lancamentos', podeDesfazer: k > 0, msg: `✅ Anotei ${acoes.length} lançamentos:\n${linhas.join('\n')}${gastos.length > 1 ? `\nTotal: ${brl(gastos.reduce((q, a) => q + a.valor, 0))}` : ''}${aviso ? '\n' + aviso : ''}` };
  }

  // ------------------------------------------------------------------ cartões
  const BANCOS = [
    ['banco do brasil', 'Banco do Brasil', '#F8D117'], ['bb', 'Banco do Brasil', '#F8D117'], ['itau', 'Itaú', '#EC7000'], ['bradesco', 'Bradesco', '#CC092F'],
    ['nubank', 'Nubank', '#820AD1'], ['nu', 'Nubank', '#820AD1'], ['santander', 'Santander', '#EC0000'], ['caixa', 'Caixa', '#005CA9'], ['inter', 'Inter', '#FF7A00'],
    ['c6', 'C6 Bank', '#242424'], ['sicoob', 'Sicoob', '#00A091'], ['sicredi', 'Sicredi', '#3FA110'], ['mercado pago', 'Mercado Pago', '#00B1EA'],
    ['picpay', 'PicPay', '#21C25E'], ['neon', 'Neon', '#00A5E0'], ['next', 'Next', '#00D355'], ['original', 'Original', '#00A859'], ['pan', 'Banco Pan', '#00AEEF'],
    ['will', 'Will Bank', '#FFD400'], ['xp', 'XP', '#111111'], ['btg', 'BTG', '#0B2A5B'], ['porto', 'Porto Seguro', '#0055A5'], ['renner', 'Renner', '#C8102E'],
    ['carrefour', 'Carrefour', '#1E5BC6'], ['havan', 'Havan', '#0B3B8C'], ['magalu', 'Magalu', '#0086FF'], ['ourocard', 'Banco do Brasil', '#F8D117'], ['credicard', 'Credicard', '#E4002B']
  ];
  /** Acha o cartão citado: "cartão de crédito itaú", "no crédito do nubank", "cartão bradesco". */
  function detectarCartao(t, cartoes, forcar) {
    cartoes = cartoes || [];
    const temChave = /\b(cartao|credito|fatura)\b/.test(t);
    if (!temChave && !forcar) return null;
    const tt = ' ' + t + ' ';
    // cartões já cadastrados (pelo nome)
    let melhor = null, tam = 0;
    for (const c of cartoes) {
      const n = sem(c.nome);
      const partes = [n].concat(n.split(/\s+/).filter((p) => p.length > 2 && !['banco', 'bank', 'cartao', 'credito'].includes(p)));
      for (const p of partes) if (tt.includes(' ' + p + ' ') && p.length > tam) { melhor = c; tam = p.length; }
    }
    if (melhor) return { id: melhor.id, nome: melhor.nome, trecho: sem(melhor.nome) };
    for (const [k, nome, cor] of BANCOS) {
      if ((k.length <= 2 ? new RegExp('\\b(cartao|credito)\\s+(do\\s+|da\\s+)?' + k + '\\b') : new RegExp('\\b' + k + '\\b')).test(t)) {
        if (k.length > 2 && !temChave && !forcar) continue;
        const ja = cartoes.find((c) => sem(c.nome) === sem(nome));
        return ja ? { id: ja.id, nome: ja.nome, trecho: k } : { novo: true, nome, cor, trecho: k };
      }
    }
    if (temChave && cartoes.length === 1) return { id: cartoes[0].id, nome: cartoes[0].nome, trecho: '' };
    return temChave ? { semBanco: true } : null;
  }
  function garantirCartao(estado, info) {
    if (!info || info.semBanco) return null;
    estado.cartoes = estado.cartoes || [];
    if (info.id) return estado.cartoes.find((c) => c.id === info.id) || null;
    const c = { id: uid(), nome: info.nome, cor: info.cor || '#1B3A6B', diaVenc: 10, fechamento: 0, limite: 0, faturas: {}, upd: Date.now() };
    estado.cartoes.push(c);
    return c;
  }
  /** Dia de fechamento; sem ele informado, considera 7 dias antes do vencimento (o mais comum nos bancos). */
  function diaFechamento(cartao) {
    const f = +(cartao && cartao.fechamento);
    if (f) return f;
    const v = +(cartao && cartao.diaVenc) || 10;
    return v > 7 ? v - 7 : v + 23;
  }
  /** Em qual fatura (mês do fechamento) uma compra cai. */
  function mesFatura(cartao, data) {
    const ym = mesDe(data);
    if (!cartao) return ym;
    return +String(data).slice(8, 10) >= Math.min(diaFechamento(cartao), diasNoMes(ym)) ? somaMes(ym, 1) : ym;
  }
  /** Vencimento da fatura: no mesmo mês do fechamento ou, se vence "antes" do fechamento, no mês seguinte. */
  function vencFatura(cartao, ym) {
    const v = +cartao.diaVenc || 10;
    const m = v > diaFechamento(cartao) ? ym : somaMes(ym, 1);
    return m + '-' + pad(Math.min(v, diasNoMes(m)));
  }
  /** Primeira fatura do cartão que ainda não tinha vencido na data informada. */
  function primeiraFaturaAberta(cartao, quando) {
    const d = iso(quando instanceof Date ? quando : new Date(quando));
    const ym0 = mesDe(d);
    for (const k of [-1, 0, 1, 2]) { const ym = somaMes(ym0, k); if (vencFatura(cartao, ym) >= d) return ym; }
    return ym0;
  }
  /**
   * A partir de qual fatura a parcelada é cobrada no cartão.
   * Parcelas de faturas que já tinham vencido quando a compra foi ligada ao cartão ficam fora:
   * a pessoa já pagou essas faturas fora do app. Sem o registro (dados antigos), usa a data da última alteração.
   */
  function parcelaDesde(p, cartao) {
    if (/^\d{4}-\d{2}$/.test(p.cartaoDesde || '')) return p.cartaoDesde;
    return cartao && +p.upd ? primeiraFaturaAberta(cartao, new Date(+p.upd)) : p.inicio;
  }
  /** Liga (ou desliga) a parcelada a um cartão, guardando a partir de qual fatura ela entra. */
  function ligarCartaoParcelado(estado, p, cartaoId, hoje) {
    cartaoId = cartaoId || undefined;
    const c = cartaoId ? (estado.cartoes || []).find((x) => x.id === cartaoId) : null;
    if (!c) { p.cartaoId = undefined; delete p.cartaoDesde; return; }
    if (p.cartaoId === cartaoId) { if (!p.cartaoDesde) p.cartaoDesde = parcelaDesde(p, c); return; }
    p.cartaoId = cartaoId;
    p.cartaoDesde = primeiraFaturaAberta(c, hoje || new Date());
  }
  /** Fatura de um cartão num mês: compras, parcelas, restante anterior, total, pago, situação. */
  function fatura(estado, cartaoId, ym, hoje, prof) {
    prof = prof || 0;
    const c = (estado.cartoes || []).find((x) => x.id === cartaoId);
    if (!c) return null;
    const compras = (estado.lancamentos || []).filter((l) => l.tipo === 'gasto' && l.cartaoId === cartaoId && mesFatura(c, l.data) === ym);
    const parcelas = (estado.parcelados || []).filter((p) => p.cartaoId === cartaoId && ym >= parcelaDesde(p, c)).map((p) => ({ p, k: parcelaNoMes(p, ym) })).filter((x) => x.k);
    let anterior = 0;
    if (prof < 12) { const fa = fatura(estado, cartaoId, somaMes(ym, -1), hoje, prof + 1); if (fa && fa.situacao === 'parcial') anterior = fa.falta; }
    const total = Math.round((compras.reduce((a, b) => a + b.valor, 0) + parcelas.reduce((a, b) => a + b.p.valor, 0) + anterior) * 100) / 100;
    const reg = (c.faturas || {})[ym] || null;
    const pago = reg ? (reg.status === 'total' ? total : Number(reg.pago) || 0) : 0;
    const falta = Math.max(0, Math.round((total - pago) * 100) / 100);
    const venc = vencFatura(c, ym);
    const h = hoje ? iso(hoje) : iso(new Date());
    let situacao = 'aberta';
    if (reg && reg.status === 'total') situacao = 'paga';
    else if (reg && reg.status === 'parcial') situacao = falta <= 0.005 ? 'paga' : 'parcial';
    else if (total === 0) situacao = 'vazia';
    else if (h > venc) situacao = 'vencida';
    return { cartao: c, ym, compras, parcelas, anterior, total, pago, falta, venc, situacao };
  }
  /** Marca o pagamento da fatura: total, ou parcial com o valor pago. */
  function pagarFatura(estado, cartaoId, ym, status, valor) {
    const c = (estado.cartoes || []).find((x) => x.id === cartaoId); if (!c) return;
    c.faturas = c.faturas || {};
    if (status === 'aberta') delete c.faturas[ym]; else c.faturas[ym] = { status, pago: status === 'parcial' ? Number(valor) || 0 : null, em: Date.now() };
    c.upd = Date.now();
  }
  function faturasAVencer(estado, hoje, dias) {
    const out = [];
    const ym0 = mesDe(iso(hoje));
    for (const c of estado.cartoes || []) {
      for (const ym of [somaMes(ym0, -1), ym0, somaMes(ym0, 1)]) {
        const f = fatura(estado, c.id, ym, hoje); if (!f || f.situacao === 'paga' || f.situacao === 'vazia' || f.falta <= 0) continue;
        const dd = Math.round((new Date(f.venc + 'T12:00') - new Date(iso(hoje) + 'T12:00')) / 864e5);
        if (dd >= 0 && dd <= dias) out.push({ fatura: f, emDias: dd });
      }
    }
    return out;
  }
  /** A fatura em aberto mais antiga do cartão (é a que a pessoa quer pagar ou consultar). */
  function faturaDaVez(estado, cartao, hoje) {
    const ym0 = mesDe(iso(hoje));
    for (const k of [-2, -1, 0, 1]) {
      const ym = somaMes(ym0, k); const f = fatura(estado, cartao.id, ym, hoje);
      if (f && f.falta > 0 && f.situacao !== 'paga' && f.situacao !== 'vazia') return ym;
    }
    return ym0;
  }

  // ------------------------------------------------------- ticket (saldo pré-pago)
  // O crédito entra em estado.recargas e as compras são lançamentos com ticketId.
  // O saldo é sempre calculado, então celular e WhatsApp nunca brigam por um número.
  const TICKET_PADRAO = 'ticket-padrao';
  const NOME_TICKET = 'Ticket Alimentação/Refeição';
  const COR_TICKET = '#0B7A54';
  const NAO_BENEFICIO = '(?!\\s+(?:d[oae]s?\\s+)?(?:estacionamento|show|cinema|onibus|metro|trem|pedagio|medio|teatro|jogo|evento|festa|estadio|parque|suporte|atendimento|embarque|aviao|voo|sorteio|bar)\\b)';
  const COMPLEMENTO_TICKET = '(?:[ /-]+(?:de\\s+)?(?:alimentacao|refeicao)){0,2}';
  const RE_TICKET = new RegExp('\\b(?:vales?[ -](?:alimentacao|refeicao|ticket|mercado)' + COMPLEMENTO_TICKET + '|cartao[ -](?:de\\s+)?(?:alimentacao|refeicao|ticket|beneficios?)' + COMPLEMENTO_TICKET + '|(?:ticket|tiquete|tiket)s?' + COMPLEMENTO_TICKET + NAO_BENEFICIO + '|alelo|sodexo|pluxee|swile)\\b');
  const RE_VA_VR = /\b(?:no|na|do|da|de|com|pelo|pela|usando)\s+(?:o\s+|a\s+|meu\s+|minha\s+)?(va|vr)\b/;
  const COMPRA_TICKET = /\b(gastei|gastamos|gasto|gastar|comprei|compramos|compra|comprar|paguei|pagamos|pagar|despesa|torrei|debitou|saiu|almocei|jantei)\b/;
  const CREDITO_FORTE = /\b(recarreguei|recarregar|recarrega|recarregue|recarga|carreguei|carregar|carrega|carregue|recebi|recebemos|caiu|cairam|entrou|depositaram|depositei|depositar|creditaram|creditou|creditei|creditar|credite|pingou|veio|vieram|estornou|estornaram|devolveram|devolveu)\b/;
  const CREDITO_FRACO = /\b(credito|coloquei|colocar|coloca|coloque|botei|botar|bota|adicionei|adicionar|adiciona|adicione|acrescentei|acrescenta|somei)\b/;
  const PALAVRAS_CREDITO = ['recarreguei', 'recarregar', 'recarrega', 'recarregue', 'recarga', 'carreguei', 'carregar', 'carrega', 'carregue', 'colocar', 'coloca', 'coloque', 'adicionei', 'acrescentei', 'acrescenta', 'somei', 'saldo', 'no valor'];
  const escRe = (x) => String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  /** Acha o cartão de benefício citado: "no ticket", "vale refeição", "no va", "no alelo" ou o nome cadastrado. */
  function detectarTicket(t, tickets) {
    tickets = tickets || [];
    const marca = t.match(RE_TICKET);
    const sigla = marca ? null : t.match(RE_VA_VR);
    const tt = ' ' + t.replace(/\bva\b/g, 'alimentacao').replace(/\bvr\b/g, 'refeicao').replace(/[/-]/g, ' ') + ' ';
    let melhor = null, tam = 0, trecho = '';
    for (const c of tickets) {
      const n = sem(c.nome);
      const partes = [n].concat(n.split(/[\s/-]+/).filter((p) => p.length > 2 && !['ticket', 'tiquete', 'cartao', 'vale', 'beneficio', 'beneficios'].includes(p)));
      for (const p of partes) {
        // nome próprio ("Caju") só conta depois de "no", "com", "do"...: "comprei caju" não é o cartão
        const achou = marca || sigla ? tt.includes(' ' + p + ' ') : !/^(alimentacao|refeicao)$/.test(p) && new RegExp('\\b(?:no|na|do|da|com|pelo|pela|usando)\\s+(?:o\\s+|a\\s+|meu\\s+|minha\\s+)?(?:cartao\\s+)?' + escRe(p) + '\\b').test(t);
        if (achou && p.length > tam) { melhor = c; tam = p.length; trecho = p; }
      }
    }
    if (!marca && !sigla && !melhor) return null;
    trecho = marca ? marca[0] : sigla ? sigla[1] : trecho;
    if (melhor) return { id: melhor.id, nome: melhor.nome, trecho };
    if (tickets.length) return { id: tickets[0].id, nome: tickets[0].nome, trecho, generico: tickets.length > 1 };
    return { novo: true, nome: NOME_TICKET, trecho };
  }
  /** Devolve o ticket citado; o primeiro tem id fixo para não duplicar quando dois aparelhos o criam. */
  function garantirTicket(estado, info) {
    estado.tickets = estado.tickets || [];
    if (info && info.id) return estado.tickets.find((c) => c.id === info.id) || null;
    if (!info || !info.nome || info.nome === NOME_TICKET) { const ja = estado.tickets[0]; if (ja) return ja; }
    const usado = estado.tickets.some((c) => c.id === TICKET_PADRAO) || (estado.excluidos || []).some((x) => x.id === TICKET_PADRAO);
    const c = { id: usado ? uid() : TICKET_PADRAO, nome: (info && info.nome) || NOME_TICKET, cor: (info && info.cor) || COR_TICKET, upd: Date.now() };
    estado.tickets.push(c);
    return c;
  }
  const centavos = (v) => Math.round(v * 100) / 100;
  const somaValor = (lista) => lista.reduce((a, b) => a + (Number(b.valor) || 0), 0);
  const recargasDe = (estado, id) => (estado.recargas || []).filter((r) => r.ticketId === id);
  const comprasTicket = (estado, id) => (estado.lancamentos || []).filter((l) => l.tipo === 'gasto' && l.ticketId === id);
  function saldoTicket(estado, id) { return centavos(somaValor(recargasDe(estado, id)) - somaValor(comprasTicket(estado, id))); }
  function gastoTicketMes(estado, id, ym) { return centavos(somaValor(comprasTicket(estado, id).filter((l) => mesDe(l.data) === ym))); }
  /** Créditos e compras do mês, do mais recente para o mais antigo. */
  function extratoTicket(estado, id, ym) {
    const cred = recargasDe(estado, id).filter((r) => mesDe(r.data) === ym).map((r) => ({ tipo: 'credito', item: r }));
    const comp = comprasTicket(estado, id).filter((l) => mesDe(l.data) === ym).map((l) => ({ tipo: 'compra', item: l }));
    return cred.concat(comp).sort((a, b) => b.item.data.localeCompare(a.item.data) || (b.item.upd || 0) - (a.item.upd || 0));
  }
  /** Tira o cartão: as compras continuam no histórico e os créditos dele saem. */
  function excluirTicket(estado, id) {
    for (const l of comprasTicket(estado, id)) { delete l.ticketId; l.upd = Date.now(); }
    for (const r of recargasDe(estado, id)) remover(estado, 'recargas', r.id);
    remover(estado, 'tickets', id);
  }

  // -------------------------------------------------------------- interpretar
  /**
   * Transforma uma frase em uma ação.
   * Retorna { tipo, ...dados } — tipos: gasto, entrada, excluir, desfazer, conta, compromisso,
   * sonho, parcelado, ticket_credito, ver_ticket, resumo, contas_pendentes, agenda_hoje, ajuda, desconhecido
   */
  function interpretar(frase, opts) {
    opts = opts || {};
    const hoje = opts.hoje || new Date();
    const original = String(frase || '').trim();
    let t = sem(original).replace(/[“”"]/g, '');
    t = extensoParaNumero(t);
    if (!t) return { tipo: 'desconhecido' };

    if (/^(oi|ola|bom dia|boa tarde|boa noite|ajuda|menu|comandos|help|inicio|começar|comecar)\b/.test(t) && !extrairValor(t)) return { tipo: 'ajuda' };
    if (/\b(desfaz|desfazer|desfaca|volta o ultimo|cancela o ultimo|apaga o ultimo|exclui o ultimo|exclua o ultimo|remove o ultimo)\b/.test(t) && !/\d/.test(t)) return { tipo: 'desfazer' };
    const tk = detectarTicket(t, opts.tickets);
    if (tk && /\b(saldo|quanto|extrato|como esta|mostra|qual)\b/.test(t) && !(extrairValor(t) && (COMPRA_TICKET.test(t) || CREDITO_FORTE.test(t) || CREDITO_FRACO.test(t)))) return { tipo: 'ver_ticket', ticket: tk };
    if (/^(muito )?(obrigad[oa]|brigad[oa]|valeu|vlw|show|beleza|blz|ok|okay|perfeito|otimo|legal|top|boa|entendi|combinado)\b/.test(t) && !extrairValor(t)) return { tipo: 'conversa', msg: 'Por nada! Estou aqui sempre que precisar. 💙' };
    if (/^(tudo bem|tudo bom|td bem|como vai|como voce esta|e ai)\b/.test(t) && !extrairValor(t)) return { tipo: 'conversa', msg: 'Tudo ótimo por aqui! 💙 Me conta: gastou alguma coisa hoje?' };
    if (!tk && /\bquanto (eu )?(ainda )?posso gastar\b/.test(t) && !extrairValor(t)) return { tipo: 'quanto_posso' };
    if (!tk && /\b(maior gasto|gastei mais|mais gastei|gasto mais|mais gasto)\b/.test(t) && !extrairValor(t)) return { tipo: 'maior_gasto' };
    const consulta = !tk && t.match(/\bquanto (?:eu )?(?:ja )?(?:gastei|gastamos|paguei)\s+(?:com|de|em|no|na|nos|nas)\s+(.+)$/);
    if (consulta && !extrairValor(t)) {
      const passado = /\bmes passado\b/.test(consulta[1]);
      const termoC = consulta[1].replace(/\b(?:n?este|n?esse|no|em)?\s*mes(?:\s+passado)?\b|\bate agora\b|\bhoje\b|\bo\b|\ba\b|\bos\b|\bas\b|[?!.]/g, ' ').replace(/\s+/g, ' ').trim();
      if (termoC) { const catC = adivinharCategoria(termoC, opts.categorias); return { tipo: 'consulta_gasto', termo: termoC, cat: catC === 'Outros' ? '' : catC, ym: somaMes(mesDe(iso(hoje)), passado ? -1 : 0) }; }
    }
    if (!tk && /\b(quanto (eu )?(ja )?gastei|quanto (me )?(sobrou|sobra|resta)|quanto (eu )?(tenho|posso gastar)|resumo|saldo|como (estou|esta|to|ta)|balanco|extrato|meu mes)\b/.test(t)) return { tipo: 'resumo' };
    if (/\b(contas? (a|pra|para) (pagar|vencer)|o que vence|quais contas|contas da semana|contas pendentes|boletos)\b/.test(t) && !extrairValor(t)) return { tipo: 'contas_pendentes' };
    if (/\b(agenda|compromissos? (de )?hoje|meus compromissos|o que tenho hoje)\b/.test(t) && !/\b(marca|marcar|agenda[r]? (uma|um|o|a)|lembra)/.test(t)) return { tipo: 'agenda_hoje' };

    const val = extrairValor(t);
    const dt = extrairData(t, hoje, 'passado'); // gastos, entradas e sonhos olham para trás
    const dtF = extrairData(t, hoje, 'futuro'); // compromissos e vencimentos olham para a frente
    const hr = extrairHora(t);

    // RESGATE / TRANSFERÊNCIA de sonho (cofrinho)
    const sonhosOpts = opts.sonhos || [];
    const verboResgate = /\b(retir\w*|resgat\w*|saque|saquei|sacar|saca|tirei|tire|tira|tirar|tiro|peguei|pegue|pega|pegar|usei|usar|use|transfir\w*|transferi|transfere|passa|passe|passar|mova|move|mover|movi)\b/;
    const palavraCofre = /\b(reserva|sonhos?|cofrinhos?|caixinhas?|poupanca|metas?)\b/;
    if (val && verboResgate.test(t) && (palavraCofre.test(t) || acharSonho(sonhosOpts, t))) {
      let origemTxt = t, destinoTxt = '';
      const mDest = t.match(/^(.*?)\s(?:para|pra|pro|ao|no|na)\s+(?:o |a |os |as )?(?:sonho |cofrinho |caixinha )?(.+)$/);
      if (mDest) {
        const d = acharSonho(sonhosOpts, mDest[2]);
        const o = acharSonho(sonhosOpts, mDest[1]);
        if (d && o && d.id !== o.id) { origemTxt = mDest[1]; destinoTxt = mDest[2]; }
      }
      const renda = !destinoTxt;
      return { tipo: 'resgate', valor: val.valor, termo: origemTxt, destino: destinoTxt, renda, data: dt ? dt.data : iso(hoje) };
    }

    // EXCLUIR: só quando a frase é um pedido ("apaga o gasto...", "pode excluir..."), nunca em "gastei 50 em Tiradentes"
    const pedidoExcluir = /^(?:(?:por favor|pode|quero|preciso|favor|me|vamos|tem como|da pra|da para|sonhai|oi|ola|ei)\s+)*(?:exclui|excluir|exclua|excluo|apaga|apagar|apague|remove|remover|remova|deleta|deletar|delete|cancela|cancelar|cancele|tira|tirar|tire|retira|retirar|retire|estorna|estornar|estorne)\b/.test(t);
    const passadoExcluir = /^(?:cancelei|apaguei|exclui|removi|deletei|estornei|retirei|tirei)\s+(?:o |a |um |uma |aquele |aquela )?(?:gasto|lancamento|compra|entrada|conta|compromisso)\b/.test(t);
    if (pedidoExcluir || passadoExcluir) {
      const termo = limparDescricao(original.replace(/\b(exclu|apag|remov|delet|cancel|tira|retira|estorn)\w*/gi, ''), [val && val.trecho, dt && dt.trecho, 'gasto', 'lancamento', 'lançamento', 'ultimo', 'último']);
      return { tipo: 'excluir', valor: val ? val.valor : null, termo: sem(termo), data: dt ? dt.data : null, alvo: tk && /\b(credito|recarga)\b/.test(t) ? 'recarga' : /compromisso|consulta|reuniao/.test(t) ? 'agenda' : /conta\b|boleto/.test(t) && !val ? 'conta' : 'lancamento' };
    }

    // "cancelei a netflix 40" conta uma novidade, não um gasto
    if (/^(cancelei|cancelamos)\b/.test(t)) return { tipo: 'desconhecido', texto: original };

    const fatoFeito = /\b(gastei|gastamos|comprei|compramos|paguei|pagamos|recebi|recebemos|ganhei|ganhamos|guardei|guardamos|juntei|poupei|economizei|investi|abasteci|almocei|jantei|caiu|entrou)\b/;

    // "recebo 800 de ticket todo mês" não é renda fixa nem conta: o crédito é lançado quando cai
    if (tk && val && /\b(todo mes|todos os meses|todo dia|cada mes|por mes|ao mes|mensal)\b/.test(t) && !fatoFeito.test(t)) return { tipo: 'plano', texto: original, msg: '🎟️ O crédito do Ticket não entra sozinho. Quando cair, me diga: "caiu 800 no ticket". 💙' };

    // RENDA FIXA: "meu salário é 5000 todo dia 5", "recebo 3000 por mês"
    const palavraRenda = /\b(salario|renda|aposentadoria|pensao|pro labore|adiantamento|recebo|ganho)\b/;
    const repeteRenda = /\b(todo|toda|todos|cada mes|por mes|ao mes|mensal|renda fixa|meu salario e|minha renda e|recebo|ganho)\b/;
    if (val && palavraRenda.test(t) && repeteRenda.test(t) && !fatoFeito.test(t)) {
      const diaR = t.match(/\bdia\s+(\d{1,2})\b/);
      const catR = /adiantamento/.test(t) ? 'Adiantamento' : /aposentadoria|pensao/.test(t) ? 'Aposentadoria' : /salario|recebo|ganho/.test(t) ? 'Salário' : 'Outra renda';
      return { tipo: 'renda_fixa', nome: catR === 'Outra renda' ? 'Renda fixa' : catR, cat: catR, valor: val.valor, dia: diaR ? +diaR[1] : 5 };
    }

    // META DE SONHO: "meta de 10000 para o carro", "quero juntar 8000 para a viagem"
    const fazPorMes = /\b(por mes|ao mes|todo mes|por semana|toda semana)\b/.test(t);
    const ehMeta = val && !fatoFeito.test(t) && !fazPorMes && (/^(?:(?:minha|meu|nossa|nosso|a|o)\s+)?(?:meta|objetivo|sonho)\b/.test(t) || /\b(?:quero|queremos|vou|vamos|preciso|pretendo|planejo)\s+(?:juntar|guardar|poupar)\b/.test(t));
    if (ehMeta) {
      const nomeM = limparDescricao(original, [val.trecho, dt && dt.trecho, 'meta', 'objetivo', 'sonho', 'quero', 'queremos', 'vou', 'vamos', 'preciso', 'pretendo', 'planejo', 'juntar', 'guardar', 'poupar', 'nosso', 'nossa', 'minha', 'meu', 'por']) || 'Meu sonho';
      return { tipo: 'meta_sonho', valor: val.valor, nome: nomeM };
    }

    // PLANO ou PERGUNTA: "vale a pena comprar uma TV de 2000" não é um gasto
    const quer = /\b(vale a pena|sera que|posso|devo|deveria|quero|queremos|queria|gostaria|pretendo|planejo|vou|vamos|preciso|pensando em|penso em|se eu)\b/.test(t);
    const verboPlano = /\b(compr\w*|gast\w*|pag\w*|guard\w*|junt\w*|invest\w*|poup\w*|econom\w*|troc\w*|viaj\w*|parcel\w*)\b/.test(t);
    const vaiPagar = /\b(tenho que|preciso|vou ter que) pagar\b/.test(t) && /\bdia\s+\d{1,2}\b/.test(t);
    if (val && !fatoFeito.test(t) && !vaiPagar && !/\b(vence|vencimento|lembr\w*|agend\w*|boleto)\b/.test(t) && ((quer && verboPlano) || /\?\s*$/.test(original))) return { tipo: 'plano', texto: original };

    // TICKET: crédito sobe o saldo, compra desce. Sem verbo ("mercado 50 no ticket") é compra, como no resto do app.
    if (tk) {
      if (!val) return { tipo: 'ver_ticket', ticket: tk, dica: true };
      const dataTk = dt ? dt.data : iso(hoje);
      const resto = limparDescricao(original, [val.trecho, dt && dt.trecho, tk.trecho].concat(PALAVRAS_CREDITO));
      const ehCredito = !COMPRA_TICKET.test(t) && (CREDITO_FORTE.test(t) || (CREDITO_FRACO.test(t) && !resto));
      if (ehCredito) return { tipo: 'ticket_credito', ticket: tk, valor: val.valor, data: dataTk };
      const tSemTk = t.replace(tk.trecho, ' ');
      const catTk = adivinharCategoria(tSemTk, opts.categorias);
      const descTk = limparDescricao(original, [val.trecho, dt && dt.trecho, tk.trecho, 'paguei', 'pago', 'usando']) || catTk;
      return { tipo: 'gasto', valor: val.valor, desc: descTk, cat: catTk, data: dataTk, pagamento: 'Ticket', ticket: tk, cartao: null, cartaoSemBanco: false, paguei: false, chave: t };
    }

    // SONHO (guardar / investir / cofrinho)
    const verboGuardar = /\b(guard(ei|ar|e|a|amos)|junt(ei|ar|e|a)|poup(ei|ar|e|a)|economiz(ei|ar)|separ(ei|ar|e|a)|reserv(ei|ar|e)|invest(i|ir|e|a|imos)|deposit(ei|ar|e|a)|apliq(uei)|aplic(ar|a|ou)|cofrinho|caixinha)\b|\b(coloquei|botei)\b.*\b(poupanca|reserva|sonho)\b/;

    // ENTRADA (renda) — todas as formas comuns de dizer que entrou dinheiro

    // FATURA DO CARTÃO (pagar / consultar)

    // COMPROMISSO (sem dinheiro, com data/hora ou palavra-chave)
    const ehCompromisso = /\b(compromisso|consulta|reuniao|lembr\w*|agend\w*|marc\w*|dentista|medico|aniversario|encontro|visita|entrevista|exame|buscar|levar|ligar para|evento|festa|curso)\b/.test(t);

  // ------------------------------------------------------------ estado padrão

  // ------------------------------------------------------------- aplicar ação

  // ------------------------------------------------------------------ limites
  const LIMITE_VALOR = 99000000;

  const CAMPOS_VALOR = ['valor', 'custo', 'limite', 'saldo', 'parcela', 'guardadoAntes', 'orcamento', 'saldoInicial', 'pago'];
  /** Corta textos em 150 caracteres e prende valores entre -99 milhões e 99 milhões (em qualquer item). */

  const limpaEmoji = (e) => String(e == null ? '' : e).replace(/[<>"'&`]/g, '').slice(0, 8);

  const COLS_ITENS = ['lancamentos', 'contas', 'rendas', 'parcelados', 'cartoes', 'tickets', 'recargas', 'anuais', 'sonhos', 'dividas', 'agenda'];
  /** Corrige o que chega de fora (app antigo, backup ou requisição forjada) antes de ser usado. */
  function sanearEstado(estado) {

  const COLS_DESFAZER = ['lancamentos', 'contas', 'rendas', 'parcelados', 'cartoes', 'tickets', 'recargas', 'anuais', 'sonhos', 'dividas', 'agenda'];
  const DESFAZIVEIS = new Set(['pagar_conta', 'gasto', 'entrada', 'parcelado', 'config_cartao', 'pagar_fatura', 'conta', 'renda_fixa', 'meta_sonho', 'compromisso', 'resgate', 'sonho', 'excluir', 'ticket_credito']);
  function fotografar(estado) {
    const foto = {};
    for (const col of COLS_DESFAZER) foto[col] = new Map((estado[col] || []).map((x) => [x.id, JSON.stringify(x)]));
    return foto;
  }
  /** O que a última ação criou, alterou ou removeu, para poder voltar exatamente ao estado anterior. */
  function compararFoto(estado, foto) {

      const antes = foto[col]; const vistos = new Set();

  function rotuloDesfazer(acao, r) {

      case 'config_cartao': return `ajuste do cartão ${it.nome}`;
      case 'entrada': return `${acao.desc || acao.cat} (${brl(acao.valor)})`;
      case 'ticket_credito': return `crédito de ${brl(acao.valor)} no Ticket`;
      case 'parcelado': return `${acao.desc} (${acao.n}x de ${brl(acao.valorParcela)})`;
      case 'conta': return `conta ${it.nome}`;
      case 'renda_fixa': return `renda fixa ${it.nome}`;
      case 'meta_sonho': return `meta do sonho ${it.nome}`;
      case 'compromisso': return `compromisso ${it.titulo}`;
      case 'sonho': return `${brl(acao.valor)} guardados em ${it.nome}`;
      case 'resgate': return `retirada de ${brl(acao.valor)}`;

      default: return 'última ação';
    }
  }
  /** Aplica a ação e guarda como desfazê-la. */
  function aplicar(estado, acao, opts) {
    const foto = acao && DESFAZIVEIS.has(acao.tipo) ? fotografar(estado) : null;
    const r = executar(estado, acao, opts);
    if (foto) {
      const d = compararFoto(estado, foto);
      if (d) { d.rotulo = rotuloDesfazer(acao, r); d.em = Date.now(); estado.desfazer = (estado.desfazer || []).concat([d]).slice(-5); r.podeDesfazer = true; }
    }
    return r;
  }
  function desfazerUltima(estado) {
    const u = (estado.desfazer || []).pop();
    if (!u) return { ok: false, msg: 'Não há nada para desfazer. 🙂' };
    const now = Date.now();
    for (const x of u.criados) remover(estado, x.col, x.id);
    for (const x of u.alterados) {
      const lista = estado[x.col] = estado[x.col] || [];
      const i = lista.findIndex((y) => y.id === x.item.id);
      if (x.col === 'sonhos' && i >= 0) { const volta = new Set((x.item.aportes || []).map((ap) => ap.id)); for (const ap of lista[i].aportes || []) if (!volta.has(ap.id)) marcarExcluido(estado, ap.id, 'aportes'); }
      const item = Object.assign({}, x.item, { upd: now });
      if (i >= 0) lista[i] = item; else lista.push(item);

    // o item volta com id novo: o antigo ficou marcado como excluído nos outros aparelhos
    const novos = {};
    for (const x of u.removidos) { const id = uid(); novos[x.item.id] = id; (estado[x.col] = estado[x.col] || []).push(Object.assign({}, x.item, { id, upd: now })); }
    for (const s of estado.sonhos || []) for (const ap of s.aportes || []) if (ap.entradaId && novos[ap.entradaId]) ap.entradaId = novos[ap.entradaId];

  function executar(estado, acao, opts) {
    opts = opts || {};

    for (const k of ['desc', 'titulo', 'nome', 'termo']) if (acao && typeof acao[k] === 'string') acao[k] = acao[k].slice(0, LIMITE_TEXTO);

TELAS.parcelados = function(){
  const ym = C.mesDe(hojeISO());
  const L = (S.parcelados || []).slice().sort((a, b) => b.inicio.localeCompare(a.inicio));

  let h = '<section class="card"><div class="cardhead"><h2>🛍️ Compras parceladas</h2><button class="addbtn" data-novo="parcelado">+ Nova</button></div><div class="sub" style="margin-bottom:8px">Lance uma vez só: as parcelas aparecem sozinhas nos meses certos. Hoje você paga <b>' + brl(ativos.reduce((a, b) => a + b.valor, 0)) + '</b>/mês.</div><div class="list">';
  const grupos = [...(S.cartoes || []).map((c) => ({ c, it: L.filter((p) => p.cartaoId === c.id) })), { c: null, it: L.filter((p) => !cartaoDe(p.cartaoId)) }].filter((g) => g.it.length);
  const linhaP = (p) => { const k = C.parcelaNoMes(p, ym); if (k) { const fim0 = C.somaMes(p.inicio, p.n - 1); return '<div class="item"><button class="mid" style="border:0;background:none;text-align:left;padding:0;display:flex;gap:12px;align-items:center;min-width:0" data-edit-parc="' + p.id + '"><span class="ico" style="background:' + soft(catInfo(p.cat).cor) + '">' + catInfo(p.cat).emoji + '</span><span style="min-width:0"><span class="ttl" style="display:block">' + esc(p.desc) + '</span><span class="meta" style="display:block">Parcela ' + k + ' de ' + p.n + ' · ' + brl(p.valor) + ' · até ' + C.mesCurto(fim0) + '</span></span></button>' + chipParc(p, ym) + checkParc(p, ym) + '</div>'; } const fim = C.somaMes(p.inicio, p.n - 1); const st = k ? { t: 'Pagando ' + k + ' de ' + p.n, k: 'info' } : fim < ym ? { t: '✓ Quitada', k: 'ok' } : { t: 'Começa ' + C.mesCurto(p.inicio), k: 'warn' }; return '<button class="item" data-edit-parc="' + p.id + '"><span class="ico" style="background:' + soft(catInfo(p.cat).cor) + '">' + catInfo(p.cat).emoji + '</span><span class="mid"><span class="ttl">' + esc(p.desc) + '</span><span class="meta">' + p.n + 'x de ' + brl(p.valor) + ' · até ' + C.mesCurto(fim) + '</span></span><span class="chip ' + st.k + '">' + st.t + '</span></button>'; };
  h += grupos.map((g) => { const at = g.it.filter((p) => C.parcelaNoMes(p, ym)); return '<div class="daylbl">' + (g.c ? '<span class="cdot" style="background:' + g.c.cor + '"></span>💳 ' + esc(g.c.nome) : 'Sem cartão definido (toque para escolher)') + ' · ' + brl(at.reduce((a, b) => a + b.valor, 0)) + '/mês</div>' + g.it.map(linhaP).join(''); }).join('') || '<div class="empty"><span class="e">🛍️</span>Diga no microfone: “comprei uma TV de 2000 em 10x no cartão Nubank”.</div>';
  h += '</div></section><div class="note">💡 Compras pequenas parceladas se acumulam sem a gente perceber. Abaixo de R$ 200, prefira pagar à vista.</div>';
  return h;
};

TELAS.agenda = function(){
  const base = new Date(view.diaAgenda + 'T12:00');
  const ini = new Date(base); ini.setDate(base.getDate() - ((base.getDay() + 6) % 7));
  const dias = Array.from({ length: 7 }, (_, i) => { const d = new Date(ini); d.setDate(ini.getDate() + i); return d; });
  const tem = new Set((S.agenda || []).map((a) => a.data));
  const contasDia = (iso) => (S.contas || []).filter((c) => C.contaNoMes(c, iso.slice(0, 7)) && Math.min(+c.dia, C.diasNoMes(iso.slice(0, 7))) === +iso.slice(8, 10));
  let h = '<section class="card"><div class="cardhead"><h2>📌 Agenda</h2><button class="addbtn" data-novo="compromisso">+ Compromisso</button></div><div class="cardhead" style="margin-bottom:8px"><button class="iconbtn" style="background:var(--surface-2)" data-semana="-7" aria-label="Semana anterior">‹</button><b style="text-transform:capitalize">' + esc(base.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })) + '</b><button class="iconbtn" style="background:var(--surface-2)" data-semana="7" aria-label="Próxima semana">›</button></div><div class="weekstrip">' + dias.map((d) => { const i = C.iso(d); return '<button class="' + (i === view.diaAgenda ? 'on' : '') + '" data-dia="' + i + '"><small>' + d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0, 3) + '</small>' + d.getDate() + (tem.has(i) || contasDia(i).length ? '<i></i>' : '<i style="background:transparent"></i>') + '</button>'; }).join('') + '</div></section>';
  const doDia = (S.agenda || []).filter((a) => a.data === view.diaAgenda).sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
  const cd = contasDia(view.diaAgenda);
  h += '<section class="card"><h2 style="font-size:18px;margin-bottom:6px;text-transform:capitalize">' + esc(base.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</h2><div class="list">';
  h += doDia.map((a) => '<div class="item"><button class="check ' + (a.feito ? 'on' : '') + '" data-feito="' + a.id + '" aria-label="Feito">' + (a.feito ? '✓' : '') + '</button><button class="mid" style="border:0;background:none;text-align:left;padding:0" data-edit-ag="' + a.id + '"><span class="ttl" style="display:block;' + (a.feito ? 'text-decoration:line-through;opacity:.6' : '') + '">' + esc(a.titulo) + '</span><span class="meta" style="display:block">' + (a.hora ? '⏰ ' + a.hora : 'Dia todo') + (a.lembrar ? ' · 🔔 lembrete' : '') + '</span></button></div>').join('');
  h += cd.map((c) => '<div class="item"><span class="ico" style="background:var(--tile-dream)">🧾</span><span class="mid"><span class="ttl">' + esc(c.nome) + '</span><span class="meta">Vencimento · ' + brl(C.valorConta(c, view.diaAgenda.slice(0, 7))) + '</span></span></div>').join('');
  if (!doDia.length && !cd.length) h += '<div class="empty"><span class="e">🗓️</span>Nada neste dia. Diga: “dentista quinta às 14h”.</div>';
  h += '</div></section>';
  const prox = (S.agenda || []).filter((a) => a.data > view.diaAgenda && !a.feito).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora)).slice(0, 6);
  if (prox.length) h += '<section class="card"><h2 style="font-size:18px;margin-bottom:6px">Próximos</h2><div class="list">' + prox.map((a) => '<button class="item" data-edit-ag="' + a.id + '"><span class="ico" style="background:var(--tile-bal)">📌</span><span class="mid"><span class="ttl">' + esc(a.titulo) + '</span><span class="meta">' + C.dataBR(a.data) + (a.hora ? ' às ' + a.hora : '') + '</span></span></button>').join('') + '</div></section>';
  return h;
};

TELAS.sonhos = function(){
  const tot = (S.sonhos || []).reduce((a, s) => a + C.totalSonho(s), 0);
  const media = (() => { const ms = [0, -1, -2].map((n) => C.resumoMes(S, C.somaMes(C.mesDe(hojeISO()), n)).gastoTotal).filter((x) => x > 0); return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0; })();
  let h = '<section class="card" style="background:var(--tile-dream)"><div class="cardhead"><h2>⭐ Meus sonhos</h2><button class="addbtn" data-novo="sonho" style="background:var(--navy);color:var(--bg)">+ Novo sonho</button></div><div style="font-family:var(--f-display);font-size:32px;font-weight:800" class="num">' + brl(tot) + '</div><div class="sub">guardados juntando todos os sonhos 💜</div>' + (media ? '<div class="note" style="margin-top:10px;background:var(--surface)">🛟 Sugestão de reserva de emergência: <b>' + brl(media * 6) + '</b> (6 meses dos seus gastos). Ela protege você de imprevistos sem precisar de empréstimo.</div>' : '') + '</section>';
  h += (S.sonhos || []).map((s) => { const t = C.totalSonho(s); const p = s.custo ? t / s.custo : 0; const sg = sugestaoSonho(s); return '<section class="card dreamcard"><div class="row">' + ring(p) + '<div style="flex:1;min-width:0"><h2 style="font-size:20px">' + (s.emoji || '⭐') + ' ' + esc(s.nome) + '</h2><div class="sub">' + (s.prazo ? 'Até ' + C.mesCurto(s.prazo) + ' · faltam ' + sg.meses + ' meses' : 'Sem prazo definido') + '</div></div><button class="iconbtn" style="background:var(--surface-2)" data-edit-sonho="' + s.id + '" aria-label="Editar sonho">✎</button></div><div class="pbar"><i style="width:' + Math.min(100, p * 100) + '%"></i></div><div class="stats"><div><small>Custa</small><b class="num">' + brl(s.custo || 0) + '</b></div><div><small>Guardado</small><b class="num">' + brl(t) + '</b></div><div><small>Por mês</small><b class="num">' + (sg.mensal ? brl(sg.mensal) : '—') + '</b></div></div>' + (p >= 1 ? '<div class="mood good">🎉 Sonho realizado! Você conseguiu. Que orgulho!</div>' : '') + '<div class="btnrow"><button class="btn sun" data-aporte="' + s.id + '">💛 Guardar</button><button class="btn ghost" data-retirar="' + s.id + '"' + (t > 0 ? '' : ' disabled style="opacity:.5"') + '>💸 Retirar</button></div></section>'; }).join('');
  h += '<section class="quote"><span style="font-size:26px">🌈</span><span>' + esc(C.INCENTIVOS[(new Date().getDate() + 2) % C.INCENTIVOS.length]) + '</span></section>';
  return h;
};

TELAS.relatorios = function(){
  const ym = view.ym; const r = C.resumoMes(S, ym);
  const meses = Array.from({ length: 6 }, (_, i) => C.somaMes(ym, i - 5));
  const rs = meses.map((m) => C.resumoMes(S, m));
  const max = Math.max(1, ...rs.map((x) => Math.max(x.entradas, x.gastoTotal)));
  const W = 320, H = 170, bw = 18, gw = W / 6;
  let bars = '';
  rs.forEach((x, i) => { const cx = i * gw + gw / 2; const he = x.entradas / max * (H - 30), hg = x.gastoTotal / max * (H - 30); bars += '<rect x="' + (cx - bw - 1) + '" y="' + (H - 20 - he) + '" width="' + bw + '" height="' + he + '" rx="4" fill="var(--leaf)"></rect><rect x="' + (cx + 1) + '" y="' + (H - 20 - hg) + '" width="' + bw + '" height="' + hg + '" rx="4" fill="var(--coral)"></rect><text x="' + cx + '" y="' + (H - 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">' + C.mesCurto(meses[i]) + '</text>'; });
  let h = '<section class="card"><div class="cardhead"><h2>📈 Entrou x Gastou</h2></div><div class="tbl" style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:520px;min-width:300px" role="img" aria-label="Entradas e gastos dos últimos 6 meses"><line x1="0" x2="' + W + '" y1="' + (H - 20) + '" y2="' + (H - 20) + '" stroke="var(--line)"></line>' + bars + '</svg></div><div class="btnrow" style="gap:14px;font-size:13px;font-weight:700"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--leaf)"></span> Entrou</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--coral)"></span> Gastou</span></div></section>';
  const cats = Object.entries(r.porCategoria).filter((x) => x[1]).sort((a, b) => b[1] - a[1]); const tc = cats.reduce((a, b) => a + b[1], 0);
  h += '<section class="card"><h2 style="margin-bottom:10px">🍩 Categorias de ' + esc(C.nomeMes(ym)) + '</h2>' + (cats.length ? cats.map(([n, v]) => { const ci = catInfo(n); return '<div class="catrow"><div class="h"><span>' + ci.emoji + ' ' + esc(n) + '</span><span class="num">' + brl(v) + ' · ' + Math.round(v / tc * 100) + '%</span></div><div class="b"><i style="width:' + (v / cats[0][1] * 100) + '%;background:' + ci.cor + '"></i></div>' + (ci.limite ? '<span class="sub">Limite ' + brl(ci.limite) + (v > ci.limite ? ' · <b class="neg">passou ' + brl(v - ci.limite) + '</b>' : ' · restam ' + brl(ci.limite - v)) + '</span>' : '') + '</div>'; }).join('') : '<div class="empty">Sem gastos neste mês.</div>') + '</section>';
  h += '<section class="card"><h2 style="margin-bottom:8px">📋 Resumo dos meses</h2><div class="tbl"><table><thead><tr><th>Mês</th><th>Entrou</th><th>Gastou</th><th>Sonhos</th><th>Sobrou</th><th>Acumulado</th></tr></thead><tbody>' + rs.map((x, i) => '<tr><td>' + C.mesCurto(meses[i]) + '</td><td class="num">' + brl(x.entradas) + '</td><td class="num">' + brl(x.gastoTotal) + '</td><td class="num">' + brl(x.guardado) + '</td><td class="num ' + (x.sobra < 0 ? 'neg' : 'pos') + '">' + brl(x.sobra) + '</td><td class="num ' + (x.saldoAcum < 0 ? 'neg' : '') + '">' + brl(x.saldoAcum) + '</td></tr>').join('') + '</tbody></table></div></section>';
  h += '<section class="card"><h2 style="margin-bottom:8px">🧮 Raio-x do mês</h2><div class="list">' + [['💰', 'Dinheiro que entrou', r.entradas], ['🏠', 'Contas fixas', -r.fixas], ['🛒', 'Gastos do dia a dia', -r.gastosDia], ['🛍️', 'Parcelas do cartão', -r.parcelas], ['⭐', 'Guardei para os sonhos', -r.guardado], ['✅', 'Sobrou no mês', r.sobra]].map((x) => '<div class="item"><span class="ico" style="background:var(--surface-2)">' + x[0] + '</span><span class="mid"><span class="ttl">' + x[1] + '</span></span><span class="val num ' + (x[2] < 0 ? '' : 'in') + '">' + brl(x[2]) + '</span></div>').join('') + '</div></section>';
  return h;
};

TELAS.whatsapp = function(){
  const num = S.perfil.whatsapp;
  const h0 = hoje(); const amanha = new Date(h0); amanha.setDate(h0.getDate() + 1);
  const venc = C.contasAVencer(S, h0, 1);
  const ag = (S.agenda || []).filter((a) => a.data === hojeISO() && !a.feito);
  let lembrete = '';
  if (venc.length || ag.length) {
    lembrete = 'Bom dia' + (S.perfil.nome ? ', ' + S.perfil.nome.split(' ')[0] : '') + '! ☀️💙\n';
    venc.filter((x) => x.emDias === 0).forEach((x) => { lembrete += '\n🔴 HOJE vence: *' + x.conta.nome + '* — ' + brl(x.valor); });
    venc.filter((x) => x.emDias === 1).forEach((x) => { lembrete += '\n🟡 Amanhã vence: *' + x.conta.nome + '* — ' + brl(x.valor); });
    if (ag.length) lembrete += '\n\n📌 Compromissos de hoje:\n' + ag.map((a) => '• ' + (a.hora ? a.hora + ' — ' : '') + a.titulo).join('\n');
    lembrete += '\n\nQuando pagar, me responda "paguei a conta de ..." ✅';
  }
  const fv = C.faturasAVencer(S, h0, 1);
  if (fv.length) {

  h += '<section class="card"><div class="cardhead"><h2>💬 WhatsApp</h2>' + (SERVER && !cfg.demo && conta && conta.verificado ? '<span class="chip ok">● Conectado</span>' : SERVER && cfg.demo ? '<span class="chip warn">Ainda não ligado</span>' : '<span class="chip warn">Modo demonstração</span>') + '</div>';
  h += '<div class="field"><label for="wa-num">Seu número de WhatsApp (com DDD)</label><input id="wa-num" inputmode="tel" placeholder="(16) 99999-9999" value="' + esc(num) + '"></div>';
  h += '<div class="note">' + (SERVER && cfg.demo ? 'O WhatsApp do Sonhaí ainda não foi ligado no servidor.' + (cfg.telegram ? ' Por enquanto, use o <b>Telegram</b> acima: é grátis e faz tudo igual.' : '') + ' A conversa abaixo é só um teste.' : SERVER ? 'Mande <b>oi</b> para o número do Sonhaí no WhatsApp e toque no link que ele responder para ligar este app à sua conta.' : 'Aqui você testa como a conversa funciona. Com o servidor do Sonhaí ligado, as mensagens chegam de verdade no seu WhatsApp: lembretes 1 dia antes e no dia do vencimento, compromissos do dia, e você lança gastos por texto ou áudio.') + '</div></section>';
  h += '<section class="card" style="padding:0;overflow:hidden"><div class="wahead"><span class="av">💙</span><div><b>Sonhaí</b><div style="font-size:12px;opacity:.85">online</div></div></div><div class="wa" id="wa" style="border-radius:0">' + (S.chat || []).slice(-40).map((m) => '<div class="bub ' + (m.de === 'me' ? 'me' : 'bot') + '">' + fmtWa(m.txt) + '<small>' + new Date(m.em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '</small></div>').join('') + '</div><form class="typebox" id="wa-form" style="padding:10px"><input id="wa-txt" placeholder="Escreva: gastei 20 no lanche" autocomplete="off" aria-label="Mensagem"><button class="btn pri" type="submit" aria-label="Enviar">➤</button></form></section>';

function textoCanal(){
  const hora = '<b>' + esc(S.perfil.lembreteHora || '08:00') + '</b>';
  if (!SERVER) return 'Enviado todo dia às ' + hora + '. Compromissos com horário também recebem aviso 1 hora antes.';
  if (conta && conta.canal) return 'Enviado todo dia às ' + hora + ' pelo <b>' + (conta.canal === 'telegram' ? 'Telegram' : 'WhatsApp') + '</b>. Compromissos com horário também recebem aviso 1 hora antes.';
  if (cfg.telegram) return '⚠️ Os lembretes ainda não chegam até você. Toque em <b>Conectar Telegram</b>, no alto desta tela.';
  if (!cfg.demo) return '⚠️ Os lembretes ainda não chegam até você. Confirme seu WhatsApp na tela de Início.';
  return '⚠️ Os lembretes ainda não estão sendo enviados. Por enquanto, confira aqui o que vence.';
}
function fmtWa(t){ return esc(t).replace(/\*(.+?)\*/g, '<b>$1</b>'); }
