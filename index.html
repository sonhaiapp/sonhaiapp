<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Sonhaí: controle financeiro por voz e WhatsApp, com lembretes de contas e metas de sonhos.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<!--CC_SERVER--></head><body>
<title>Sonhaí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1B3A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: app de celular (coluna única de até 560px), barra inferior com microfone central; blocos coloridos por assunto */
:root{
  --bg:#EEF3FA; --surface:#FFFFFF; --surface-2:#F5F8FD; --ink:#13233A; --ink-2:#4A5B74; --line:#DCE4F0;
  --navy:#1B3A6B; --sun:#FFC83D; --sun-ink:#5A4000; --coral:#FF6B5B; --leaf:#16B47D; --sky:#2F80ED; --grape:#7B5CFA; --pink:#F0569A;
  --good:#11A36F; --warn:#E59A00; --bad:#E5484D;
  --tile-in:#E3F7EE; --tile-out:#FFE9E5; --tile-dream:#FFF4D1; --tile-bal:#E6EEFF;
  --shadow:0 1px 2px rgba(19,35,58,.06),0 8px 24px rgba(19,35,58,.07);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1522; --surface:#152132; --surface-2:#1B2A3F; --ink:#EAF1FB; --ink-2:#A7B6CC; --line:#26374F;
  --navy:#8DB4FF; --sun:#FFCF52; --sun-ink:#2B1F00; --coral:#FF8072; --leaf:#2FD198; --sky:#5C9DFF; --grape:#9A82FF; --pink:#FF77B2;
  --good:#2FD198; --warn:#FFB938; --bad:#FF6B6F;
  --tile-in:#123629; --tile-out:#3A1F1E; --tile-dream:#3A3012; --tile-bal:#18294A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1522; --surface:#152132; --surface-2:#1B2A3F; --ink:#EAF1FB; --ink-2:#A7B6CC; --line:#26374F;
  --navy:#8DB4FF; --sun:#FFCF52; --sun-ink:#2B1F00; --coral:#FF8072; --leaf:#2FD198; --sky:#5C9DFF; --grape:#9A82FF; --pink:#FF77B2;
  --good:#2FD198; --warn:#FFB938; --bad:#FF6B6F;
  --tile-in:#123629; --tile-out:#3A1F1E; --tile-dream:#3A3012; --tile-bal:#18294A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{background:var(--navy);color:#fff;padding-block:14px 56px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
:root[data-theme="dark"] .top{color:#0D1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{color:#0D1522}}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.2px}
.brand .logo{width:36px;height:36px;border-radius:12px;background:var(--sun);display:grid;place-items:center;flex:none}
.hello{margin-top:16px;font-size:15px;opacity:.85}
.hello b{font-family:var(--f-display);font-size:26px;display:block;opacity:1;font-weight:700;line-height:1.15}
.top .blob{position:absolute;border-radius:50%;opacity:.16;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;font-size:19px}
.monthsel{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.monthsel button{border:0;background:transparent;color:inherit;width:32px;height:32px;border-radius:50%;font-size:16px}
.monthsel span{font-weight:700;font-size:14px;min-width:84px;white-space:nowrap;text-align:center;text-transform:capitalize}

.demo{margin:-40px 16px 0;position:relative;z-index:2;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.demo button{margin-left:auto;border:0;background:var(--sun-ink);color:var(--sun);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.demo + .content{margin-top:12px}
.content{margin-top:-40px;position:relative;z-index:1;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--ink-2);font-size:14px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{border:0;background:none;color:var(--sky);font-weight:800;font-size:14px;padding:6px 0}

/* herói do mês */
.hero{padding:18px}
.hero .lbl{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin:6px 0 4px}
.hero .big.neg{color:var(--bad)} .hero .big.pos{color:var(--good)}
.mood{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:600;font-size:15px}
.mood.good{background:var(--tile-in)} .mood.warn{background:var(--tile-dream)} .mood.bad{background:var(--tile-out)}
.meter{margin-top:14px}
.meter .bar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter .fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px;gap:8px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:14px;min-width:0;border:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .t{font-size:13px;font-weight:800;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--ink-2)}
.t-in{background:var(--tile-in)} .t-out{background:var(--tile-out)} .t-dream{background:var(--tile-dream)} .t-bal{background:var(--tile-bal)}

/* listas */
.list{display:grid;gap:2px;grid-template-columns:minmax(0,1fr)}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:14px;border:0;background:transparent;text-align:left;width:100%}
.item:hover{background:var(--surface-2)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0;display:block}
.item .mid > span{display:block}
.item .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:800;white-space:nowrap}
.val.out{color:var(--ink)} .val.in{color:var(--good)}
.daylbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:12px 4px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.ok{background:var(--tile-in);color:var(--good)} .chip.warn{background:var(--tile-dream);color:var(--warn)} .chip.bad{background:var(--tile-out);color:var(--bad)} .chip.info{background:var(--tile-bal);color:var(--sky)}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;flex:none}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.empty{text-align:center;color:var(--ink-2);padding:18px 8px;font-size:15px}
.empty .e{font-size:34px;display:block;margin-bottom:4px}

/* donut + categorias */
.donutwrap{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}
.donutwrap > *{min-width:0}
@media (max-width:380px){.donutwrap{grid-template-columns:1fr}.donutwrap svg{margin:0 auto}}
.catrow{display:grid;gap:4px;margin-bottom:10px;grid-template-columns:minmax(0,1fr)}
.catrow .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.catrow .h span:last-child{flex:none}
.catrow .h span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .b{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.catrow .b i{display:block;height:100%;border-radius:999px}

/* sonhos */
.dreams{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,72%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -4px;padding-inline:4px}
.dream{scroll-snap-align:start;border-radius:18px;padding:14px;background:var(--tile-dream);display:grid;gap:8px;border:0;text-align:left;min-width:0}
.dream .top2{display:flex;gap:10px;align-items:center}
.ring{width:56px;height:56px;flex:none}
.dream .n{font-weight:800;font-size:16px;line-height:1.2}
.dream .s{font-size:13px;color:var(--ink-2)}
.pbar{height:10px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:999px}
.dreamcard{display:grid;gap:10px}
.dreamcard .row{display:flex;gap:12px;align-items:center}
.dreamcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dreamcard .stats div{background:var(--surface-2);border-radius:12px;padding:8px;min-width:0}
.dreamcard .stats b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dreamcard .stats small{font-size:11.5px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.quote{background:linear-gradient(135deg,var(--tile-dream),var(--tile-out));border-radius:16px;padding:14px;font-weight:700;display:flex;gap:10px;align-items:center}

/* botões */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--navy);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--tile-out);color:var(--bad)}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.addbtn{border:0;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}

/* abas internas */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chips button.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);pointer-events:none}
.nav .in{max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;pointer-events:auto;box-shadow:0 -6px 24px rgba(19,35,58,.08);border-radius:22px 22px 0 0}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 12px;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.nav button .i{font-size:22px;line-height:1;filter:grayscale(.6);opacity:.8}
.nav button.on{color:var(--navy)} .nav button.on .i{filter:none;opacity:1}
.nav .micwrap .mic{padding:0;position:relative;top:-22px;width:72px;height:72px;border-radius:50%;margin:0 auto;background:var(--coral);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,107,91,.45);border:5px solid var(--bg);filter:none}
.nav .micwrap{padding:0;display:flex;flex-direction:column;align-items:center;height:64px}
.nav .micwrap small{position:relative;top:-18px;font-weight:800;color:var(--coral)}

/* folha (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,18,32,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92%;overflow:auto;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:24px;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:17px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{font-family:var(--f-display);font-size:28px!important;font-weight:700}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catpick button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 2px;display:grid;gap:2px;justify-items:center;font-size:11px;font-weight:700;line-height:1.15;min-width:0}
.catpick button span:first-child{font-size:22px}
.catpick button.on{border-color:var(--navy);background:var(--tile-bal)}
.catpick button span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}

/* voz */
.voice{text-align:center;display:grid;gap:14px;justify-items:center}
.bigmic{width:120px;height:120px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:50px;display:grid;place-items:center;position:relative;box-shadow:0 12px 30px rgba(255,107,91,.4)}
.bigmic.rec::before,.bigmic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--coral);animation:pulse 1.4s ease-out infinite}
.bigmic.rec::after{animation-delay:.7s}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
.transcript{min-height:52px;font-size:19px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
.hint{font-size:14px;color:var(--ink-2)}
.examples{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.examples button{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.typebox{display:flex;gap:8px;width:100%}
.typebox input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px}
.result{width:100%;text-align:left;background:var(--surface-2);border-radius:18px;padding:14px;display:grid;gap:10px;border:2px solid var(--leaf)}
.result .msg{white-space:pre-line;font-weight:600}

/* whatsapp */
.wa{background:#E7DDD3;border-radius:18px;padding:12px;display:grid;gap:8px;max-height:420px;overflow:auto}
:root[data-theme="dark"] .wa{background:#0B141A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{background:#0B141A}}
.bub{max-width:85%;padding:8px 11px;border-radius:12px;font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.12);color:#111B21}
.bub.me{justify-self:end;background:#D9FDD3;border-top-right-radius:4px}
.bub.bot{justify-self:start;background:#FFFFFF;border-top-left-radius:4px}
:root[data-theme="dark"] .bub{color:#E9EDEF} :root[data-theme="dark"] .bub.me{background:#005C4B} :root[data-theme="dark"] .bub.bot{background:#202C33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub{color:#E9EDEF}:root:not([data-theme="light"]) .bub.me{background:#005C4B}:root:not([data-theme="light"]) .bub.bot{background:#202C33}}
.bub small{display:block;text-align:right;font-size:10.5px;opacity:.6;margin-top:2px}
.wahead{display:flex;align-items:center;gap:10px;background:#008069;color:#fff;border-radius:18px 18px 0 0;padding:10px 12px;margin-bottom:-8px}
.wahead .av{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between;width:calc(100% - 32px);max-width:520px;box-shadow:var(--shadow);animation:up .25s ease}
.toast button{border:0;background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:6px 10px;font-weight:800}
.morelist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.morelist button{border:0;border-radius:18px;padding:16px 8px;display:grid;justify-items:center;gap:6px;font-weight:800;font-size:13.5px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.morelist button span:first-child{font-size:28px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekstrip button{border:0;background:var(--surface-2);border-radius:14px;padding:8px 0;display:grid;gap:0;justify-items:center;font-weight:800;min-width:0}
.weekstrip button small{font-size:11px;color:var(--ink-2);text-transform:uppercase}
.weekstrip button.on{background:var(--navy);color:var(--bg)} .weekstrip button.on small{color:inherit}
.weekstrip button i{width:6px;height:6px;border-radius:50%;background:var(--coral);display:block;margin-top:2px}
.note{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:14px;padding:10px 12px}

  /** Troca números por extenso por algarismos: "cinquenta e dois reais" -> "52 reais". */

    const tokens = txt.split(/(\s+)/);

    while (i < tokens.length) {
      const w = tokens[i];
      if (UNID[w] !== undefined || w === 'mil') {
        let total = 0, atual = 0, j = i, ultimo = i, achou = false;
        while (j < tokens.length) {
          const t = tokens[j];
          if (/^\s+$/.test(t)) { j++; continue; }
          if (UNID[t] !== undefined) { atual += UNID[t]; achou = true; ultimo = j; j++; continue; }

  // -------------------------------------------------------- extração de valor

    if (m) return { valor: +m[1] + (+m[2]) / 100, trecho: m[0] };
    m = t.match(/(\d+)\s*centavos?/);
    const re = /r\$\s*(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)|(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(reais|real|conto|contos|pila|r\$)?/g;
    let melhor = null, x;
    while ((x = re.exec(t))) {
      const bruto = x[1] || x[2];
      const comMoeda = !!x[1] || !!x[3];

      if (!comMoeda) {

  function extrairHora(t) {

    ['nubank', 'Nubank', '#820AD1'], ['nu', 'Nubank', '#820AD1'], ['santander', 'Santander', '#EC0000'], ['caixa', 'Caixa', '#005CA9'], ['inter', 'Inter', '#FF7A00'],
    ['c6', 'C6 Bank', '#242424'], ['sicoob', 'Sicoob', '#00A091'], ['sicredi', 'Sicredi', '#3FA110'], ['mercado pago', 'Mercado Pago', '#00B1EA'],
    ['picpay', 'PicPay', '#21C25E'], ['neon', 'Neon', '#00A5E0'], ['next', 'Next', '#00D355'], ['original', 'Original', '#00A859'], ['pan', 'Banco Pan', '#00AEEF'],
    ['will', 'Will Bank', '#FFD400'], ['xp', 'XP', '#111111'], ['btg', 'BTG', '#0B2A5B'], ['porto', 'Porto Seguro', '#0055A5'], ['renner', 'Renner', '#C8102E'],
    ['carrefour', 'Carrefour', '#1E5BC6'], ['havan', 'Havan', '#0B3B8C'], ['magalu', 'Magalu', '#0086FF'], ['ourocard', 'Banco do Brasil', '#F8D117'], ['credicard', 'Credicard', '#E4002B']
  ];
  /** Acha o cartão citado: "cartão de crédito itaú", "no crédito do nubank", "cartão bradesco". */
  function detectarCartao(t, cartoes, forcar) {
    cartoes = cartoes || [];
    const temChave = /\b(cartao|credito|fatura)\b/.test(t);
    if (!temChave && !forcar) return null;
    const tt = ' ' + t + ' ';
    // cartões já cadastrados (pelo nome)
    let melhor = null, tam = 0;
    for (const c of cartoes) {
      const n = sem(c.nome);
      const partes = [n].concat(n.split(/\s+/).filter((p) => p.length > 2 && !['banco', 'bank', 'cartao', 'credito'].includes(p)));
      for (const p of partes) if (tt.includes(' ' + p + ' ') && p.length > tam) { melhor = c; tam = p.length; }
    }
    if (melhor) return { id: melhor.id, nome: melhor.nome, trecho: sem(melhor.nome) };
    for (const [k, nome, cor] of BANCOS) {
      if ((k.length <= 2 ? new RegExp('\\b(cartao|credito)\\s+(do\\s+|da\\s+)?' + k + '\\b') : new RegExp('\\b' + k + '\\b')).test(t)) {
        if (k.length > 2 && !temChave && !forcar) continue;
        const ja = cartoes.find((c) => sem(c.nome) === sem(nome));
        return ja ? { id: ja.id, nome: ja.nome, trecho: k } : { novo: true, nome, cor, trecho: k };
      }
    }
    if (temChave && cartoes.length === 1) return { id: cartoes[0].id, nome: cartoes[0].nome, trecho: '' };
    return temChave ? { semBanco: true } : null;
  }
  function garantirCartao(estado, info) {
    if (!info || info.semBanco) return null;
    estado.cartoes = estado.cartoes || [];
    if (info.id) return estado.cartoes.find((c) => c.id === info.id) || null;
    const c = { id: uid(), nome: info.nome, cor: info.cor || '#1B3A6B', diaVenc: 10, fechamento: 0, limite: 0, faturas: {}, upd: Date.now() };
    estado.cartoes.push(c);
    return c;
  }
  /** Em qual fatura (mês) uma compra cai, considerando o dia de fechamento. */
  function mesFatura(cartao, data) {
    const ym = mesDe(data);
    return cartao && +cartao.fechamento && +String(data).slice(8, 10) >= +cartao.fechamento ? somaMes(ym, 1) : ym;
  }
  /** Fatura de um cartão num mês: compras, parcelas, restante anterior, total, pago, situação. */
  function fatura(estado, cartaoId, ym, hoje, prof) {
    prof = prof || 0;
    const c = (estado.cartoes || []).find((x) => x.id === cartaoId);
    if (!c) return null;
    const compras = (estado.lancamentos || []).filter((l) => l.tipo === 'gasto' && l.cartaoId === cartaoId && mesFatura(c, l.data) === ym);
    const parcelas = (estado.parcelados || []).filter((p) => p.cartaoId === cartaoId).map((p) => ({ p, k: parcelaNoMes(p, ym) })).filter((x) => x.k);
    let anterior = 0;
    if (prof < 12) { const fa = fatura(estado, cartaoId, somaMes(ym, -1), hoje, prof + 1); if (fa && fa.situacao === 'parcial') anterior = fa.falta; }
    const total = Math.round((compras.reduce((a, b) => a + b.valor, 0) + parcelas.reduce((a, b) => a + b.p.valor, 0) + anterior) * 100) / 100;
    const reg = (c.faturas || {})[ym] || null;
    const pago = reg ? (reg.status === 'total' ? total : Number(reg.pago) || 0) : 0;
    const falta = Math.max(0, Math.round((total - pago) * 100) / 100);
    const venc = ym + '-' + pad(Math.min(+c.diaVenc || 10, diasNoMes(ym)));
    const h = hoje ? iso(hoje) : iso(new Date());
    let situacao = 'aberta';
    if (reg && reg.status === 'total') situacao = 'paga';
    else if (reg && reg.status === 'parcial') situacao = falta <= 0.005 ? 'paga' : 'parcial';
    else if (total === 0) situacao = 'vazia';
    else if (h > venc) situacao = 'vencida';
    return { cartao: c, ym, compras, parcelas, anterior, total, pago, falta, venc, situacao };
  }
  /** Marca o pagamento da fatura: total, ou parcial com o valor pago. */
  function pagarFatura(estado, cartaoId, ym, status, valor) {
    const c = (estado.cartoes || []).find((x) => x.id === cartaoId); if (!c) return;
    c.faturas = c.faturas || {};
    if (status === 'aberta') delete c.faturas[ym]; else c.faturas[ym] = { status, pago: status === 'parcial' ? Number(valor) || 0 : null, em: Date.now() };
    c.upd = Date.now();
  }
  function faturasAVencer(estado, hoje, dias) {
    const out = [];
    for (const c of estado.cartoes || []) {
      for (const ym of [mesDe(iso(hoje)), somaMes(mesDe(iso(hoje)), 1)]) {
        const f = fatura(estado, c.id, ym, hoje); if (!f || f.situacao === 'paga' || f.situacao === 'vazia' || f.falta <= 0) continue;
        const dd = Math.round((new Date(f.venc + 'T12:00') - new Date(iso(hoje) + 'T12:00')) / 864e5);
        if (dd >= 0 && dd <= dias) out.push({ fatura: f, emDias: dd });
      }
    }
    return out;
  }

  // -------------------------------------------------------------- interpretar
  /**
   * Transforma uma frase em uma ação.
   * Retorna { tipo, ...dados } — tipos: gasto, entrada, excluir, desfazer, conta, compromisso,
   * sonho, parcelado, resumo, contas_pendentes, agenda_hoje, ajuda, desconhecido
   */
  function interpretar(frase, opts) {
    opts = opts || {};
    const hoje = opts.hoje || new Date();
    const original = String(frase || '').trim();
    let t = sem(original).replace(/[“”"]/g, '');
    t = extensoParaNumero(t);
    if (!t) return { tipo: 'desconhecido' };

    if (/^(oi|ola|bom dia|boa tarde|boa noite|ajuda|menu|comandos|help|inicio|começar|comecar)\b/.test(t) && !extrairValor(t)) return { tipo: 'ajuda' };
    if (/\b(desfaz|desfazer|desfaca|volta o ultimo|cancela o ultimo|apaga o ultimo|exclui o ultimo|exclua o ultimo|remove o ultimo)\b/.test(t) && !/\d/.test(t)) return { tipo: 'desfazer' };
    if (/\b(quanto (eu )?(ja )?gastei|resumo|saldo|como (estou|esta|to|ta)|balanco|extrato|meu mes)\b/.test(t)) return { tipo: 'resumo' };
    if (/\b(contas? (a|pra|para) (pagar|vencer)|o que vence|quais contas|contas da semana|contas pendentes|boletos)\b/.test(t) && !extrairValor(t)) return { tipo: 'contas_pendentes' };
    if (/\b(agenda|compromissos? (de )?hoje|meus compromissos|o que tenho hoje)\b/.test(t) && !/\b(marca|marcar|agenda[r]? (uma|um|o|a)|lembra)/.test(t)) return { tipo: 'agenda_hoje' };

    const val = extrairValor(t);
    const dt = extrairData(t, hoje);
    const hr = extrairHora(t);

    // RESGATE / TRANSFERÊNCIA de sonho (cofrinho)
    const sonhosOpts = opts.sonhos || [];
    const verboResgate = /\b(retir\w*|resgat\w*|saque|saquei|sacar|saca|tirei|tire|tira|tirar|tiro|peguei|pegue|pega|pegar|usei|usar|use|transfir\w*|transferi|transfere|passa|passe|passar|mova|move|mover|movi)\b/;
    const palavraCofre = /\b(reserva|sonhos?|cofrinhos?|caixinhas?|poupanca|metas?)\b/;
    if (val && verboResgate.test(t) && (palavraCofre.test(t) || acharSonho(sonhosOpts, t))) {
      let origemTxt = t, destinoTxt = '';
      const mDest = t.match(/^(.*?)\s(?:para|pra|pro|ao|no|na)\s+(?:o |a |os |as )?(?:sonho |cofrinho |caixinha )?(.+)$/);
      if (mDest) {
        const d = acharSonho(sonhosOpts, mDest[2]);
        const o = acharSonho(sonhosOpts, mDest[1]);
        if (d && o && d.id !== o.id) { origemTxt = mDest[1]; destinoTxt = mDest[2]; }
      }
      const renda = !destinoTxt;
      return { tipo: 'resgate', valor: val.valor, termo: origemTxt, destino: destinoTxt, renda, data: dt ? dt.data : iso(hoje) };
    }

    // EXCLUIR
    if (/\b(exclu|apag|remov|delet|cancel|tira|retira|estorn)\w*/.test(t)) {
      const termo = limparDescricao(original.replace(/\b(exclu|apag|remov|delet|cancel|tira|retira|estorn)\w*/gi, ''), [val && val.trecho, dt && dt.trecho, 'gasto', 'lancamento', 'lançamento', 'ultimo', 'último']);
      return { tipo: 'excluir', valor: val ? val.valor : null, termo: sem(termo), data: dt ? dt.data : null, alvo: /compromisso|consulta|reuniao/.test(t) ? 'agenda' : /conta\b|boleto/.test(t) && !val ? 'conta' : 'lancamento' };
    }

    // SONHO (guardar dinheiro)
    if (/\b(guardei|juntei|poupei|economizei|separei|reservei|investi|depositei)\b/.test(t) && val) {
      const resto = sem(limparDescricao(original, [val.trecho, 'guardei', 'juntei', 'poupei', 'economizei', 'separei', 'reservei', 'investi', 'depositei', 'sonho', 'para o', 'pro']));
      return { tipo: 'sonho', valor: val.valor, termo: resto, data: dt ? dt.data : iso(hoje) };
    }

    // ENTRADA
    if (/\b(recebi|ganhei|entrou|caiu|recebimento|me pagaram|vendi|salario caiu|pingou)\b/.test(t) && val) {
      let tipoE = /salario/.test(t) ? 'Salário' : /adiantamento|vale\b/.test(t) ? 'Adiantamento' : /13|decimo/.test(t) ? '13º salário' : /bonus|plr/.test(t) ? 'Bônus/PLR' : /comissao/.test(t) ? 'Comissão' : /aluguel/.test(t) ? 'Aluguel recebido' : /vendi|venda/.test(t) ? 'Venda' : /pix/.test(t) ? 'Pix recebido' : /aposentadoria|inss/.test(t) ? 'Aposentadoria' : 'Outra renda';
      const desc = limparDescricao(original, [val.trecho, dt && dt.trecho, 'recebi', 'ganhei', 'entrou', 'caiu', 'me pagaram', 'pingou']) || tipoE;
      return { tipo: 'entrada', valor: val.valor, desc, cat: tipoE, data: dt ? dt.data : iso(hoje) };
    }

    // FATURA DO CARTÃO (pagar / consultar)
    if (/\bfatura\b/.test(t) || (/\bcartao\b/.test(t) && /\b(paguei|quitei|quanto|como esta|ver)\b/.test(t) && !/\b(com|no)\s+(o\s+)?cartao\b/.test(t))) {
      const card = detectarCartao(t, opts.cartoes, true);
      const mesM = t.match(/\b(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/);
      let ym = mesDe(iso(hoje));
      if (mesM) { const mi = MESES_SEM.indexOf(mesM[1]) + 1; ym = hoje.getFullYear() + '-' + pad(mi); if (ym > somaMes(mesDe(iso(hoje)), 2)) ym = (hoje.getFullYear() - 1) + '-' + pad(mi); }
      else if (/\b(passad|anterior)\w*/.test(t)) ym = somaMes(ym, -1);
      else if (/\b(proxim|que vem)\w*/.test(t)) ym = somaMes(ym, 1);
      const vM = t.match(/\b(?:vence|vencimento)\D{0,12}(\d{1,2})\b/); const fM = t.match(/\bfecha\w*\D{0,12}(\d{1,2})\b/);
      if ((vM || fM) && !/\b(paguei|quitei)\b/.test(t)) return { tipo: 'config_cartao', cartao: card, diaVenc: vM ? +vM[1] : null, fechamento: fM ? +fM[1] : null };
      if (/\b(paguei|quitei|pago|paga|pagamos)\b/.test(t)) {
        const parcial = val && !/\b(toda|total|inteira|tudo)\b/.test(t);
        return { tipo: 'pagar_fatura', cartao: card, ym, valor: val ? val.valor : null, parcial: !!parcial };
      }
      if (/\b(quanto|ver|mostra|como esta|valor|qual)\b/.test(t) || !val) return { tipo: 'ver_fatura', cartao: card, ym };
    }

    // COMPROMISSO (sem dinheiro, com data/hora ou palavra-chave)
    const ehCompromisso = /\b(compromisso|consulta|reuniao|lembr\w*|agend\w*|marc\w*|dentista|medico|aniversario|encontro|visita|entrevista|exame|buscar|levar|ligar para|evento|festa|curso)\b/.test(t);
    const ehConta = /\b(conta|boleto|fatura|vence|vencimento|mensalidade|todo dia|todo mes|mensal)\b/.test(t);
    if (ehCompromisso && (!val || (hr && !/\b(paguei|gastei|comprei)\b/.test(t))) && !(ehConta && val)) {
      const titulo = limparDescricao(original, [dt && dt.trecho, hr && hr.trecho, 'compromisso', 'me lembra', 'me lembre', 'lembrete', 'lembrar', 'agendar', 'agenda', 'marcar', 'marca', 'tenho', 'vou ter', 'vou', 'que', 'de', 'as', 'às', 'horas', 'hora', 'amanhã', 'hoje']) || 'Compromisso';
      return { tipo: 'compromisso', titulo, data: dt ? dt.data : iso(hoje), hora: hr ? hr.hora : '', valor: val ? val.valor : null };
    }

    // CONTA A PAGAR (vencimento)
    if (ehConta && !/\b(paguei|gastei)\b/.test(t)) {
      const diaM = t.match(/\bdia\s+(\d{1,2})\b/);
      const dia = diaM ? +diaM[1] : (dt ? +dt.data.slice(8, 10) : null);
      const nome = limparDescricao(original, [val && val.trecho, dt && dt.trecho, diaM && diaM[0], 'conta de', 'conta do', 'conta da', 'conta', 'boleto', 'fatura', 'vence', 'vencimento', 'todo', 'mes', 'mês', 'mensal', 'cadastra', 'cadastrar', 'nova', 'tenho', 'que', 'pagar', 'valor']) || 'Conta';
      const recorrente = !/\b(so esse mes|uma vez|unica)\b/.test(t);
      return { tipo: 'conta', nome, valor: val ? val.valor : 0, dia: dia || hoje.getDate(), cat: adivinharCategoria(t + ' ' + sem(nome), opts.categorias) === 'Outros' ? 'Contas da Casa' : adivinharCategoria(t + ' ' + sem(nome), opts.categorias), recorrente, vencimento: dt && !diaM ? dt.data : null };
    }

    if (!val) {
      if (/\bpaguei\b/.test(t)) return { tipo: 'pagar_conta', chave: t, data: dt ? dt.data : iso(hoje) };
      return { tipo: 'desconhecido', texto: original };
    }

    // PARCELADO
    const parc = t.match(/\b(?:em\s*)?(\d{1,2})\s*(?:x|vezes|parcelas)\b(?:\s*de\s*(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?))?/);
    if (parc && +parc[1] > 1) {
      const n = +parc[1];
      let vp;
      if (parc[2]) vp = parseFloat(parc[2].replace(',', '.'));
      else vp = Math.round((val.valor / n) * 100) / 100;
      const desc = limparDescricao(original, [parc[0], val.trecho, dt && dt.trecho, 'parcelado', 'parcelada', 'vezes']) || 'Compra parcelada';
      const cardP = detectarCartao(t, opts.cartoes, true);
      const descP = cardP && cardP.trecho ? limparDescricao(original, [parc[0], val.trecho, dt && dt.trecho, cardP.trecho, 'parcelado', 'parcelada', 'vezes', 'banco']) || 'Compra parcelada' : desc;
      return { tipo: 'parcelado', desc: descP, valorParcela: vp, n, cat: adivinharCategoria(t, opts.categorias), inicio: mesDe(dt ? dt.data : iso(hoje)), data: dt ? dt.data : iso(hoje), cartao: cardP && !cardP.semBanco ? cardP : null };
    }

    // GASTO (padrão)
    const card = detectarCartao(t, opts.cartoes, false);
    const tSemBanco = card && card.trecho ? t.replace(new RegExp('\\b' + card.trecho + '\\b', 'g'), ' ') : t;
    const cat = adivinharCategoria(tSemBanco, opts.categorias);
    const desc = limparDescricao(original, [val.trecho, dt && dt.trecho, card && card.trecho, 'no cartão', 'no crédito', 'no débito', 'no pix', 'paguei', 'pago', 'banco', 'do', 'da']) || cat;
    return { tipo: 'gasto', valor: val.valor, desc, cat, data: dt ? dt.data : iso(hoje), pagamento: card ? 'Cartão' : pagamento(t), cartao: card && !card.semBanco ? card : null, cartaoSemBanco: !!(card && card.semBanco), paguei: /\bpaguei\b/.test(t) && !card, chave: t };
  }

  // ------------------------------------------------------------ estado padrão
  function estadoVazio() {
    return {
      versao: 2,
      perfil: { nome: '', whatsapp: '', orcamento: 0, saldoInicial: 0, lembreteHora: '08:00', ticket: false, tema: 'auto', criadoEm: new Date().toISOString() },
      categorias: CATEGORIAS.map((c) => ({ nome: c.nome, emoji: c.emoji, cor: c.cor, limite: 0 })),
      lancamentos: [], contas: [], parcelados: [], cartoes: [], anuais: [], sonhos: [{ id: uid(), nome: 'Reserva de emergência', emoji: '🛟', custo: 0, prazo: '', guardadoAntes: 0, aportes: [], upd: Date.now() }],
      dividas: [], agenda: [], excluidos: [], chat: []
    };
  }

  // ------------------------------------------------------------- aplicar ação
  /** Aplica a ação interpretada ao estado. Retorna { ok, msg, item, colecao }. */
  function aplicar(estado, acao, opts) {
    opts = opts || {};
    const origem = opts.origem || 'app';
    const hoje = opts.hoje || new Date();
    const now = Date.now();
    const nomeP = (estado.perfil && estado.perfil.nome ? estado.perfil.nome.split(/\s|,|e\s/)[0] : '');
    const catInfo = (n) => (estado.categorias || []).find((c) => c.nome === n) || CATEGORIAS.find((c) => c.nome === n) || { emoji: '✨' };
    switch (acao.tipo) {
      case 'pagar_conta': {
        const c = acharConta(estado, acao.chave);
        if (!c) return { ok: false, msg: 'Não encontrei essa conta cadastrada. 🤔 Me diga o valor, ex.: "paguei 120 de luz".' };
        const ym = mesDe(acao.data || iso(hoje)); c.pagos = c.pagos || {}; c.pagos[ym] = true; c.upd = now;
        return { ok: true, item: c, colecao: 'contas', msg: `✅ Marquei *${c.nome}* (${brl(c.valor)}) como paga em ${nomeMes(ym)}. Uma preocupação a menos! 😌` };
      }
      case 'gasto': {
        if (acao.paguei) {
          const c = acharConta(estado, acao.chave);
          if (c) { const ym = mesDe(acao.data); c.pagos = c.pagos || {}; c.pagos[ym] = true; if (acao.valor) c.valor = acao.valor; c.upd = now; return { ok: true, item: c, colecao: 'contas', msg: `✅ Conta *${c.nome}* paga: ${brl(c.valor)} em ${nomeMes(ym)}. Uma preocupação a menos! 😌` }; }
        }
        const cc = garantirCartao(estado, acao.cartao);
        const item = { id: uid(), tipo: 'gasto', data: acao.data, desc: acao.desc, cat: acao.cat, valor: acao.valor, pago: true, pagamento: cc ? 'Cartão' : (acao.pagamento || ''), cartaoId: cc ? cc.id : undefined, origem, upd: now };
        estado.lancamentos.push(item);
        let txtCartao = '';
        if (cc) { const f = fatura(estado, cc.id, mesFatura(cc, acao.data), hoje); txtCartao = `\n💳 Lançado no cartão *${cc.nome}* — fatura de ${mesCurto(f.ym)}: ${brl(f.total)}.`; }
        else if (acao.cartaoSemBanco) txtCartao = (estado.cartoes || []).length ? `\n💳 Em qual cartão? Diga, por ex.: "no cartão ${(estado.cartoes[0] || {}).nome}".` : '\n💳 Dica: diga o banco ("cartão de crédito Itaú") que eu separo por cartão.';
        const r = resumoMes(estado, mesDe(acao.data));
        let extra = '';
        if (r.orcamento > 0) {
          if (r.pctOrcamento >= 1) extra = `\n⚠️ Atenção: você passou do orçamento do mês (${Math.round(r.pctOrcamento * 100)}%). Vamos segurar um pouquinho? 💛`;
          else if (r.pctOrcamento >= 0.85) extra = `\n🟡 Você já usou ${Math.round(r.pctOrcamento * 100)}% do orçamento. Faltam ${brl(r.orcamento - r.gastoTotal)}.`;
          else extra = `\n✅ Orçamento sob controle: ${Math.round(r.pctOrcamento * 100)}% usado.`;
        }
        const lim = catInfo(acao.cat).limite;
        if (lim > 0) { const g = r.porCategoria[acao.cat] || 0; if (g > lim) extra += `\n🔔 ${acao.cat} passou do limite de ${brl(lim)}.`; }
        return { ok: true, item, colecao: 'lancamentos', msg: `${catInfo(acao.cat).emoji} Anotado! ${brl(acao.valor)} em *${acao.cat}*${acao.desc && acao.desc !== acao.cat ? ` (${acao.desc})` : ''} — ${dataBR(acao.data)}.${txtCartao}${extra}` };
      }
      case 'entrada': {
        const item = { id: uid(), tipo: 'entrada', data: acao.data, desc: acao.desc, cat: acao.cat, valor: acao.valor, pago: true, origem, upd: now };
        estado.lancamentos.push(item);
        return { ok: true, item, colecao: 'lancamentos', msg: `💰 Que notícia boa${nomeP ? ', ' + nomeP : ''}! Entrada de ${brl(acao.valor)} (${acao.cat}) registrada.` };
      }
      case 'parcelado': {
        const cc = garantirCartao(estado, acao.cartao);
        const inicio = cc && acao.data ? mesFatura(cc, acao.data) : acao.inicio;
        const item = { id: uid(), desc: acao.desc, cat: acao.cat, valor: acao.valorParcela, n: acao.n, inicio, cartaoId: cc ? cc.id : undefined, origem, upd: now };
        estado.parcelados.push(item);
        return { ok: true, item, colecao: 'parcelados', msg: `🛍️ Compra parcelada anotada: ${acao.desc} — ${acao.n}x de ${brl(acao.valorParcela)} a partir de ${mesCurto(inicio)}${cc ? ` no cartão *${cc.nome}*` : ''}. As parcelas entram sozinhas nos meses certos.${cc ? '' : '\n💳 Dica: diga o cartão ("em 10x no cartão Nubank") que eu separo por cartão.'}` };
      }
      case 'config_cartao': {
        const cc = garantirCartao(estado, acao.cartao && !acao.cartao.semBanco ? acao.cartao : null) || ((estado.cartoes || []).length === 1 ? estado.cartoes[0] : null);
        if (!cc) return { ok: false, msg: 'De qual cartão? Ex.: "a fatura do Itaú vence dia 10 e fecha dia 3".' };
        if (acao.diaVenc) cc.diaVenc = acao.diaVenc; if (acao.fechamento) cc.fechamento = acao.fechamento; cc.upd = now;
        return { ok: true, item: cc, colecao: 'cartoes', msg: `💳 Cartão *${cc.nome}*: vence dia ${cc.diaVenc}${cc.fechamento ? `, fecha dia ${cc.fechamento}` : ''}. Vou te lembrar da fatura 1 dia antes e no dia. 💙` };
      }
      case 'pagar_fatura': case 'ver_fatura': {
        const cartoes = estado.cartoes || [];
        if (!cartoes.length) return { ok: false, msg: '💳 Você ainda não tem cartões cadastrados. Lance um gasto assim: "gastei 50 no mercado no cartão de crédito Itaú" que eu crio o cartão.' };
        const cc = acao.cartao && acao.cartao.id ? cartoes.find((c) => c.id === acao.cartao.id) : cartoes.length === 1 ? cartoes[0] : null;
        if (!cc) {
          if (acao.tipo === 'ver_fatura') return { ok: true, msg: '💳 *Faturas de ' + nomeMes(acao.ym) + '*\n' + cartoes.map((c) => { const f = fatura(estado, c.id, acao.ym, hoje); return `• ${c.nome}: ${brl(f.total)} — ${rotuloFatura(f)}`; }).join('\n') };
          return { ok: false, msg: 'Qual cartão? 🤔 ' + cartoes.map((c) => c.nome).join(', ') + '.\nEx.: "paguei a fatura do ' + cartoes[0].nome + '"' };
        }
        const f = fatura(estado, cc.id, acao.ym, hoje);
        if (acao.tipo === 'ver_fatura') return { ok: true, msg: `💳 *Fatura ${cc.nome} — ${nomeMes(acao.ym)}*\nTotal: ${brl(f.total)}${f.anterior ? ` (inclui ${brl(f.anterior)} do mês anterior)` : ''}\nVence dia ${f.venc.slice(8)} · ${rotuloFatura(f)}${f.situacao === 'parcial' ? `\nPago ${brl(f.pago)} · falta ${brl(f.falta)}` : ''}\n\nQuando pagar, me diga: "paguei a fatura do ${cc.nome}" ou "paguei 500 da fatura do ${cc.nome}".` };
        const parcial = acao.parcial && acao.valor != null && acao.valor < f.total - 0.005;
        pagarFatura(estado, cc.id, acao.ym, parcial ? 'parcial' : 'total', acao.valor);
        const f2 = fatura(estado, cc.id, acao.ym, hoje);
        if (parcial) return { ok: true, item: cc, colecao: 'cartoes', msg: `💳 Pagamento parcial registrado na fatura *${cc.nome}* de ${mesCurto(acao.ym)}: pago ${brl(f2.pago)} de ${brl(f2.total)}.\n⚠️ Ficou faltando ${brl(f2.falta)} — vai aparecer na próxima fatura. Cuidado com os juros do rotativo! 💛` };
        return { ok: true, item: cc, colecao: 'cartoes', msg: `✅ Fatura *${cc.nome}* de ${mesCurto(acao.ym)} paga: ${brl(f2.total)}. Uma preocupação a menos! 😌` };
      }
      case 'conta': {
        const existente = estado.contas.find((c) => sem(c.nome) === sem(acao.nome));
        if (existente) { existente.valor = acao.valor || existente.valor; existente.dia = acao.dia; existente.upd = now; return { ok: true, item: existente, colecao: 'contas', msg: `🗓️ Atualizei a conta *${existente.nome}*: vence todo dia ${existente.dia}${existente.valor ? ', ' + brl(existente.valor) : ''}. Vou te lembrar um dia antes e no dia. 😉` }; }
        const item = { id: uid(), nome: acao.nome, cat: acao.cat, valor: acao.valor, dia: acao.dia, recorrente: acao.recorrente !== false, mesUnico: acao.recorrente === false ? mesDe(acao.vencimento || iso(hoje)) : '', pagos: {}, origem, upd: now };
        estado.contas.push(item);
        return { ok: true, item, colecao: 'contas', msg: `🗓️ Conta cadastrada: *${acao.nome}*${acao.valor ? ' — ' + brl(acao.valor) : ''}, vence dia ${acao.dia}. Pode deixar que eu te lembro um dia antes e no dia do vencimento. 💙` };
      }
      case 'compromisso': {
        const item = { id: uid(), titulo: acao.titulo, data: acao.data, hora: acao.hora || '', lembrar: true, feito: false, origem, upd: now };
        estado.agenda.push(item);
        return { ok: true, item, colecao: 'agenda', msg: `📌 Compromisso anotado: *${acao.titulo}* — ${dataBR(acao.data)}${acao.hora ? ' às ' + acao.hora : ''}. Eu te lembro no dia${acao.hora ? ' e 1 hora antes' : ''}! ⏰` };
      }
      case 'resgate': {
        const sonhos = estado.sonhos || [];
        if (!sonhos.length) return { ok: false, msg: 'Você ainda não tem sonhos cadastrados. Crie um na aba ⭐ Sonhos!' };
        const s = acharSonho(sonhos, acao.termo) || (sonhos.length === 1 ? sonhos[0] : null);
        if (!s) return { ok: false, msg: 'De qual cofrinho você quer retirar? 🤔 Seus sonhos: ' + sonhos.map((x) => x.nome).join(', ') + '.\nEx.: "retire 500 da ' + sonhos[0].nome + ' e coloque como renda"' };
        const saldo = totalSonho(s);
        if (acao.valor > saldo + 0.005) return { ok: false, msg: saldo > 0 ? `💛 Em *${s.nome}* só tem ${brl(saldo)} guardados. Quer retirar esse valor?` : `💛 *${s.nome}* ainda não tem nada guardado.` };
        const destino = acao.destino ? acharSonho(sonhos, acao.destino) : null;
        const res = retirarDoSonho(estado, s, acao.valor, { data: acao.data, destino, renda: acao.renda && !destino, origem });
        if (destino) return { ok: true, item: s, colecao: 'sonhos', msg: `🔁 Transferi ${brl(acao.valor)} de *${s.nome}* para *${destino.nome}*.\n${s.emoji || '⭐'} ${s.nome}: ${brl(totalSonho(s))}\n${destino.emoji || '⭐'} ${destino.nome}: ${brl(totalSonho(destino))}` };
        return { ok: true, item: res.entrada || s, colecao: res.entrada ? 'lancamentos' : 'sonhos', msg: `💸 Retirei ${brl(acao.valor)} de *${s.nome}*${res.entrada ? ' e lancei como renda do mês' : ''}.\n${s.emoji || '⭐'} Ficaram ${brl(totalSonho(s))} guardados${s.custo ? ` (${Math.round(totalSonho(s) / s.custo * 100)}% do sonho)` : ''}.\n${/reserva|emergencia/.test(sem(s.nome)) ? 'Tudo bem usar a reserva quando precisa, é pra isso que ela existe. Depois a gente repõe juntos! 💙' : 'Quando der, a gente repõe juntos! 💙'}` };
      }
      case 'sonho': {
        const sonhos = estado.sonhos || [];
        if (!sonhos.length) return { ok: false, msg: 'Você ainda não tem sonhos cadastrados. Crie um na aba ⭐ Sonhos!' };
        let s = acharSonho(sonhos, acao.termo) || sonhos[0];
        s.aportes = s.aportes || []; s.aportes.push({ id: uid(), data: acao.data, valor: acao.valor }); s.upd = now;
        const tot = totalSonho(s);
        const pct = s.custo ? Math.min(100, Math.round((tot / s.custo) * 100)) : 0;
        return { ok: true, item: s, colecao: 'sonhos', msg: `⭐ Uhuul! ${brl(acao.valor)} guardados para *${s.nome}*.${s.custo ? ` Você já está em ${pct}% do caminho (${brl(tot)} de ${brl(s.custo)}).` : ''} Cada passo conta! 🚀` };
      }
      case 'excluir': {
        if (acao.alvo === 'agenda') {
          const cand = estado.agenda.filter((a) => !acao.termo || acao.termo.split(' ').some((p) => p.length > 2 && sem(a.titulo).includes(p)));
          const a = cand.sort((x, y) => (y.upd || 0) - (x.upd || 0))[0];
          if (!a) return { ok: false, msg: 'Não encontrei esse compromisso. 🤔' };
          remover(estado, 'agenda', a.id);
          return { ok: true, removido: a, colecao: 'agenda', msg: `🗑️ Compromisso *${a.titulo}* removido.` };
        }
        if (acao.alvo === 'conta') {
          const c = estado.contas.find((x) => acao.termo && acao.termo.split(' ').some((p) => p.length > 2 && sem(x.nome).includes(p)));
          if (!c) return { ok: false, msg: 'Não encontrei essa conta. 🤔' };
          remover(estado, 'contas', c.id);
          return { ok: true, removido: c, colecao: 'contas', msg: `🗑️ Conta *${c.nome}* removida.` };
        }
        const termos = (acao.termo || '').split(' ').filter((p) => p.length > 2 && !['gasto', 'lancamento', 'ultimo', 'valor', 'reais', 'aquele', 'esse'].includes(p));
        let cand = estado.lancamentos.slice();
        if (acao.valor != null) cand = cand.filter((l) => Math.abs(l.valor - acao.valor) < 0.005);
        if (acao.data) cand = cand.filter((l) => l.data === acao.data);
        if (termos.length) {
          const c2 = cand.filter((l) => termos.some((p) => sem(l.desc + ' ' + l.cat).includes(p)));
          if (c2.length || acao.valor == null) cand = c2;
        }
        if (!cand.length) return { ok: false, msg: `Não encontrei esse lançamento${acao.valor != null ? ' de ' + brl(acao.valor) : ''}. Confere pra mim? 🤔` };
        const l = cand.sort((a, b) => (b.upd || 0) - (a.upd || 0))[0];
        remover(estado, 'lancamentos', l.id);
        return { ok: true, removido: l, colecao: 'lancamentos', msg: `🗑️ Prontinho! Excluí ${l.tipo === 'entrada' ? 'a entrada' : 'o gasto'} de ${brl(l.valor)} (${l.desc || l.cat}, ${dataBR(l.data)}).` };
      }
      case 'desfazer': {
        const todos = [];
        for (const col of ['lancamentos', 'agenda', 'contas', 'parcelados']) for (const it of estado[col] || []) if (it.origem === origem || !opts.soOrigem) todos.push({ col, it });
        todos.sort((a, b) => (b.it.upd || 0) - (a.it.upd || 0));
        const u = todos[0];
        if (!u) return { ok: false, msg: 'Não há nada para desfazer. 🙂' };
        remover(estado, u.col, u.it.id);
        return { ok: true, removido: u.it, colecao: u.col, msg: `↩️ Desfeito: ${u.it.desc || u.it.titulo || u.it.nome}${u.it.valor ? ' (' + brl(u.it.valor) + ')' : ''}.` };
      }
      case 'resumo': return { ok: true, msg: textoResumo(estado, mesDe(iso(hoje)), hoje) };
      case 'contas_pendentes': return { ok: true, msg: textoContas(estado, hoje) };
      case 'agenda_hoje': return { ok: true, msg: textoAgenda(estado, hoje) };
      case 'ajuda': return { ok: true, msg: textoAjuda(estado) };
      default: return { ok: false, msg: 'Hmm, não entendi direitinho. 🙈 Tente assim:\n• "gastei 35 reais na padaria"\n• "conta de luz vence dia 10, 120 reais"\n• "dentista amanhã às 15h"\n• "exclui o gasto de 35"\n• "resumo"' };
    }
  }

  function acharConta(estado, chave) {
    const t = ' ' + sem(chave) + ' ';
    let melhor = null, pts = 0;
    for (const c of estado.contas || []) {
      const ps = sem(c.nome).split(/\s+/).filter((p) => p.length > 2 && !['conta', 'apto', 'casa', 'das', 'dos', 'para'].includes(p));
      const n = ps.filter((p) => t.includes(' ' + p)).length;
      if (n > pts) { pts = n; melhor = c; }
    }
    return melhor;
  }
  function rotuloFatura(f) { return { paga: '✅ Paga', parcial: '🟡 Paga parcialmente', vencida: '🔴 Vencida', aberta: '⏳ Em aberto', vazia: 'Sem compras' }[f.situacao]; }
  function remover(estado, col, id) {
    if (col === 'lancamentos') {
      const l = (estado.lancamentos || []).find((x) => x.id === id);
      if (l && l.sonhoId) { const sn = (estado.sonhos || []).find((x) => x.id === l.sonhoId); if (sn) { sn.aportes = (sn.aportes || []).filter((ap) => ap.entradaId !== id); sn.upd = Date.now(); } }
    }
    estado[col] = (estado[col] || []).filter((x) => x.id !== id);
    estado.excluidos = estado.excluidos || [];
    estado.excluidos.push({ id, col, em: Date.now() });
    if (estado.excluidos.length > 2000) estado.excluidos = estado.excluidos.slice(-2000);
  }

  const dataBR = (d) => { if (!d) return ''; const [y, m, dd] = d.split('-'); return dd + '/' + m + (y && +y !== new Date().getFullYear() ? '/' + y : ''); };
  const PARADAS = ['para', 'pra', 'pro', 'meu', 'minha', 'nosso', 'nossa', 'sonho', 'cofrinho', 'caixinha', 'familia', 'com', 'das', 'dos', 'nas', 'nos'];
  /** Encontra o sonho citado no texto ("reserva de emergência", "viagem"…). */
  function acharSonho(sonhos, texto) {
    const t = ' ' + sem(texto || '') + ' ';
    let melhor = null, pts = 0;
    for (const s of sonhos || []) {
      const nome = sem(s.nome);
      let n = t.includes(' ' + nome + ' ') ? 10 : 0;
      n += nome.split(/[^a-z0-9]+/).filter((p) => p.length > 2 && !PARADAS.includes(p) && t.includes(' ' + p.slice(0, Math.max(4, p.length - 2)))).length;
      if (n > pts) { pts = n; melhor = s; }
    }
    return melhor;
  }
  /** Tira dinheiro de um sonho; opcionalmente lança como renda ou manda para outro sonho. */
  function retirarDoSonho(estado, s, valor, o) {
    o = o || {};
    const data = o.data || iso(new Date());
    const now = Date.now();
    const ap = { id: uid(), data, valor: -Math.abs(valor), resgate: true };
    let entrada = null;
    if (o.destino) {
      ap.transferencia = true; ap.para = o.destino.id;
      o.destino.aportes = o.destino.aportes || [];
      o.destino.aportes.push({ id: uid(), data, valor: Math.abs(valor), transferencia: true, de: s.id }); o.destino.upd = now;
    } else if (o.renda !== false) {
      entrada = { id: uid(), tipo: 'entrada', data, desc: 'Resgate: ' + s.nome, cat: 'Resgate de sonho', valor: Math.abs(valor), pago: true, origem: o.origem || 'app', sonhoId: s.id, upd: now };
      estado.lancamentos.push(entrada); ap.entradaId = entrada.id;
    }
    s.aportes = s.aportes || []; s.aportes.push(ap); s.upd = now;
    return { aporte: ap, entrada };
  }
  const contaNoGuardado = (x) => !x.resgate && !x.transferencia;
  const totalSonho = (s) => (Number(s.guardadoAntes) || 0) + (s.aportes || []).reduce((a, b) => a + (Number(b.valor) || 0), 0);

  // ----------------------------------------------------------------- cálculos
  function parcelaNoMes(p, ym) {
    const k = difMeses(p.inicio, ym);
    return k >= 0 && k < p.n ? k + 1 : 0;
  }
  function contaNoMes(c, ym) { return c.recorrente !== false ? (!c.desde || c.desde <= ym) && (!c.ate || c.ate >= ym) : c.mesUnico === ym; }

  function resumoMes(estado, ym) {
    const L = (estado.lancamentos || []).filter((l) => mesDe(l.data) === ym);
    const entradas = L.filter((l) => l.tipo === 'entrada').reduce((a, b) => a + b.valor, 0);
    const gastosDia = L.filter((l) => l.tipo === 'gasto' && !l.ticket).reduce((a, b) => a + b.valor, 0);
    const ticketGasto = L.filter((l) => l.tipo === 'gasto' && l.ticket).reduce((a, b) => a + b.valor, 0);
    const contas = (estado.contas || []).filter((c) => contaNoMes(c, ym));
    const fixas = contas.reduce((a, b) => a + (Number(b.valor) || 0), 0);
    const fixasPagas = contas.filter((c) => c.pagos && c.pagos[ym]).reduce((a, b) => a + (Number(b.valor) || 0), 0);
    const parcs = (estado.parcelados || []).map((p) => ({ p, k: parcelaNoMes(p, ym) })).filter((x) => x.k);
    const parcelas = parcs.reduce((a, b) => a + b.p.valor, 0);
    const guardado = (estado.sonhos || []).reduce((a, s) => a + (s.aportes || []).filter((x) => mesDe(x.data) === ym && contaNoGuardado(x)).reduce((q, w) => q + (Number(w.valor) || 0), 0), 0);
    const anuaisMes = (estado.anuais || []).filter((a) => +a.mes === +ym.slice(5, 7));
    const gastoTotal = gastosDia + fixas + parcelas;
    const sobraAntes = entradas - gastoTotal;
    const sobra = sobraAntes - guardado;
    const porCategoria = {};
    L.filter((l) => l.tipo === 'gasto').forEach((l) => { porCategoria[l.cat] = (porCategoria[l.cat] || 0) + l.valor; });
    contas.forEach((c) => { porCategoria[c.cat] = (porCategoria[c.cat] || 0) + (Number(c.valor) || 0); });
    parcs.forEach((x) => { porCategoria[x.p.cat] = (porCategoria[x.p.cat] || 0) + x.p.valor; });
    const orcamento = Number(estado.perfil && estado.perfil.orcamento) || entradas;
    // saldo acumulado
    let saldoAcum = Number(estado.perfil && estado.perfil.saldoInicial) || 0;
    const meses = mesesComDados(estado);
    for (const m of meses) { if (m > ym) break; if (m === ym) continue; const r = resumoSimples(estado, m); saldoAcum += r; }
    saldoAcum += sobra;
    const maior = Object.entries(porCategoria).sort((a, b) => b[1] - a[1])[0];
    return {
      ym, entradas, gastosDia, ticketGasto, fixas, fixasPagas, parcelas, parcs, contas, guardado, gastoTotal, sobraAntes, sobra, saldoAcum, porCategoria, orcamento,
      pctOrcamento: orcamento > 0 ? gastoTotal / orcamento : 0, pctGuardado: entradas > 0 ? guardado / entradas : 0,
      maiorCategoria: maior ? { nome: maior[0], valor: maior[1] } : null, anuaisMes, lancamentos: L
    };
  }
  function resumoSimples(estado, ym) {
    const L = (estado.lancamentos || []).filter((l) => mesDe(l.data) === ym);
    const e = L.filter((l) => l.tipo === 'entrada').reduce((a, b) => a + b.valor, 0);
    const g = L.filter((l) => l.tipo === 'gasto' && !l.ticket).reduce((a, b) => a + b.valor, 0);
    const f = (estado.contas || []).filter((c) => contaNoMes(c, ym)).reduce((a, b) => a + (Number(b.valor) || 0), 0);
    const p = (estado.parcelados || []).filter((x) => parcelaNoMes(x, ym)).reduce((a, b) => a + b.valor, 0);
    const s = (estado.sonhos || []).reduce((a, q) => a + (q.aportes || []).filter((x) => mesDe(x.data) === ym && contaNoGuardado(x)).reduce((z, w) => z + (Number(w.valor) || 0), 0), 0);
    return e - g - f - p - s;
  }
  function mesesComDados(estado) {
    const set = new Set();
    (estado.lancamentos || []).forEach((l) => set.add(mesDe(l.data)));
    (estado.sonhos || []).forEach((s) => (s.aportes || []).forEach((a) => set.add(mesDe(a.data))));
    return Array.from(set).sort();
  }

  /** Contas a vencer nos próximos `dias` dias (inclui hoje). */
  function contasAVencer(estado, hoje, dias) {
    const out = [];
    const base = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
    for (let i = -0; i <= dias; i++) {
      const d = new Date(base); d.setDate(d.getDate() + i);
      const ym = iso(d).slice(0, 7);
      const ultimo = diasNoMes(ym);
      for (const c of estado.contas || []) {
        if (!contaNoMes(c, ym)) continue;
        const dia = Math.min(+c.dia, ultimo);
        if (dia === d.getDate() && !(c.pagos && c.pagos[ym])) out.push({ conta: c, data: iso(d), emDias: i, ym });
      }
      for (const p of estado.parcelados || []) { /* cartão: lembrado pela fatura */ }
    }
    return out;
  }
  function contasAtrasadas(estado, hoje) {
    const ym = iso(hoje).slice(0, 7);
    return (estado.contas || []).filter((c) => contaNoMes(c, ym) && !(c.pagos && c.pagos[ym]) && Math.min(+c.dia, diasNoMes(ym)) < hoje.getDate());
  }

  // -------------------------------------------------------- textos (WhatsApp)
  function textoResumo(estado, ym, hoje) {
    const r = resumoMes(estado, ym);
    const nome = estado.perfil && estado.perfil.nome ? estado.perfil.nome : '';
    let s = `📊 *Resumo de ${nomeMes(ym)}*${nome ? ' — ' + nome : ''}\n\n💰 Entrou: ${brl(r.entradas)}\n🛒 Gastos: ${brl(r.gastoTotal)}\n   • Contas fixas: ${brl(r.fixas)}\n   • Dia a dia: ${brl(r.gastosDia)}\n   • Parcelas: ${brl(r.parcelas)}\n⭐ Guardei p/ sonhos: ${brl(r.guardado)}\n✅ Sobrou: ${brl(r.sobra)}`;
    if (r.maiorCategoria) s += `\n🔝 Maior gasto: ${r.maiorCategoria.nome} (${brl(r.maiorCategoria.valor)})`;

  h += mood(r) + '</section>';

    '<button class="tile t-bal" data-go="relatorios"><span class="t">🏦 Saldo acumulado</span><span class="v num ' + (r.saldoAcum < 0 ? 'neg' : '') + '">' + brl(r.saldoAcum) + '</span><span class="s">' + (r.maiorCategoria ? 'Maior gasto: ' + esc(r.maiorCategoria.nome) : 'Sem gastos ainda') + '</span></button></section>';
  if (ehHoje) {
    h += '<section class="card"><div class="cardhead"><h2>☀️ Hoje</h2><span class="sub">' + esc(hoje().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</span></div><div class="list">';
    const linhas = [];
    atras.forEach((c) => linhas.push('<div class="item"><span class="ico" style="background:var(--tile-out)">⚠️</span><span class="mid"><span class="ttl">' + esc(c.nome) + '</span><span class="meta">Venceu dia ' + c.dia + ' · ' + brl(c.valor) + '</span></span><button class="check" data-pagar="' + c.id + '" aria-label="Marcar como paga"></button></div>'));
    venc.forEach((x) => linhas.push('<div class="item"><span class="ico" style="background:' + (x.emDias ? 'var(--tile-dream)' : 'var(--tile-out)') + '">🧾</span><span class="mid"><span class="ttl">' + esc(x.conta.nome) + '</span><span class="meta">' + (x.emDias ? 'Vence amanhã' : 'Vence hoje') + ' · ' + brl(x.conta.valor) + '</span></span><button class="check" data-pagar="' + x.conta.id + '" aria-label="Marcar como paga"></button></div>'));
    C.faturasAVencer(S, hoje(), 1).forEach((x) => linhas.push('<div class="item"><span class="ico" style="background:' + soft(x.fatura.cartao.cor) + '">💳</span><span class="mid"><span class="ttl">Fatura ' + esc(x.fatura.cartao.nome) + '</span><span class="meta">' + (x.emDias ? 'Vence amanhã' : 'Vence hoje') + ' · ' + brl(x.fatura.falta) + '</span></span><button class="check" data-pagfat="' + x.fatura.cartao.id + '" data-ym="' + x.fatura.ym + '" aria-label="Pagar fatura"></button></div>'));
    ag.forEach((a) => linhas.push('<div class="item"><span class="ico" style="background:var(--tile-bal)">📌</span><span class="mid"><span class="ttl">' + esc(a.titulo) + '</span><span class="meta">' + (a.hora ? 'às ' + a.hora : 'Dia todo') + '</span></span><button class="check" data-feito="' + a.id + '" aria-label="Marcar como feito"></button></div>'));

  h += '<section class="card"><div class="cardhead"><h2>🧾 Contas do mês</h2><button class="link" data-go="contas">Ver contas ›</button></div><div class="meter" style="margin-top:0"><div class="bar"><div class="fill" style="width:' + (r.contas.length ? pagas / r.contas.length * 100 : 0) + '%;background:var(--sky)"></div></div><div class="legend"><span><b>' + pagas + '</b> de ' + r.contas.length + ' pagas</span><span>Falta pagar <b>' + brl(r.fixas - r.fixasPagas) + '</b></span></div></div>' + (r.parcelas ? '<div class="note" style="margin-top:10px">🛍️ Parcelas do cartão neste mês: <b>' + brl(r.parcelas) + '</b> (' + r.parcs.length + ' compras)</div>' : '') + (r.anuaisMes.length ? '<div class="note" style="margin-top:8px">📌 Vence este mês: ' + r.anuaisMes.map((a) => esc(a.nome) + ' (' + brl(a.valor) + ')').join(', ') + '</div>' : '') + '</section>';

TELAS.gastos = function(){

  h += '<div class="cardhead" style="margin:0"><span class="sub"><b class="num" style="color:var(--ink);font-size:18px">' + brl(total) + '</b> em ' + f.length + ' lançamentos</span><button class="addbtn" data-novo="' + (view.abaGastos === 'entradas' ? 'entrada' : 'gasto') + '">+ Adicionar</button></div></div>';

TELAS.contas = function(){

TELAS.cartoes = function(){

TELAS.parcelados = function(){

  h += grupos.map((g) => { const at = g.it.filter((p) => C.parcelaNoMes(p, ym)); return '<div class="daylbl">' + (g.c ? '<span class="cdot" style="background:' + g.c.cor + '"></span>💳 ' + esc(g.c.nome) : 'Sem cartão definido (toque para escolher)') + ' · ' + brl(at.reduce((a, b) => a + b.valor, 0)) + '/mês</div>' + g.it.map(linhaP).join(''); }).join('') || '<div class="empty"><span class="e">🛍️</span>Diga no microfone: “comprei uma TV de 2000 em 10x no cartão Nubank”.</div>';

TELAS.agenda = function(){
  const base = new Date(view.diaAgenda + 'T12:00');
  const ini = new Date(base); ini.setDate(base.getDate() - ((base.getDay() + 6) % 7));
  const dias = Array.from({ length: 7 }, (_, i) => { const d = new Date(ini); d.setDate(ini.getDate() + i); return d; });
  const tem = new Set((S.agenda || []).map((a) => a.data));

  let h = '<section class="card"><div class="cardhead"><h2>📌 Agenda</h2><button class="addbtn" data-novo="compromisso">+ Compromisso</button></div><div class="cardhead" style="margin-bottom:8px"><button class="iconbtn" style="background:var(--surface-2)" data-semana="-7" aria-label="Semana anterior">‹</button><b style="text-transform:capitalize">' + esc(base.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })) + '</b><button class="iconbtn" style="background:var(--surface-2)" data-semana="7" aria-label="Próxima semana">›</button></div><div class="weekstrip">' + dias.map((d) => { const i = C.iso(d); return '<button class="' + (i === view.diaAgenda ? 'on' : '') + '" data-dia="' + i + '"><small>' + d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0, 3) + '</small>' + d.getDate() + (tem.has(i) || contasDia(i).length ? '<i></i>' : '<i style="background:transparent"></i>') + '</button>'; }).join('') + '</div></section>';
  const doDia = (S.agenda || []).filter((a) => a.data === view.diaAgenda).sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
  const cd = contasDia(view.diaAgenda);
  h += '<section class="card"><h2 style="font-size:18px;margin-bottom:6px;text-transform:capitalize">' + esc(base.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</h2><div class="list">';
  h += doDia.map((a) => '<div class="item"><button class="check ' + (a.feito ? 'on' : '') + '" data-feito="' + a.id + '" aria-label="Feito">' + (a.feito ? '✓' : '') + '</button><button class="mid" style="border:0;background:none;text-align:left;padding:0" data-edit-ag="' + a.id + '"><span class="ttl" style="display:block;' + (a.feito ? 'text-decoration:line-through;opacity:.6' : '') + '">' + esc(a.titulo) + '</span><span class="meta" style="display:block">' + (a.hora ? '⏰ ' + a.hora : 'Dia todo') + (a.lembrar ? ' · 🔔 lembrete' : '') + '</span></button></div>').join('');
  h += cd.map((c) => '<div class="item"><span class="ico" style="background:var(--tile-dream)">🧾</span><span class="mid"><span class="ttl">' + esc(c.nome) + '</span><span class="meta">Vencimento · ' + brl(c.valor) + '</span></span></div>').join('');
  if (!doDia.length && !cd.length) h += '<div class="empty"><span class="e">🗓️</span>Nada neste dia. Diga: “dentista quinta às 14h”.</div>';

function render(){
  aplicarTema();
  const t = view.tela; const nome = S.perfil.nome;
  const mostraMes = ['inicio', 'gastos', 'contas', 'relatorios', 'cartoes'].includes(t);
  let h = '<header class="top wrap"><span class="blob" style="width:180px;height:180px;background:var(--sun);right:-50px;top:-60px"></span><span class="blob" style="width:120px;height:120px;background:var(--coral);left:-40px;bottom:-50px"></span><div class="row"><div class="brand"><span class="logo" aria-hidden="true">' + LOGO + '</span>Sonhaí</div>' + (mostraMes ? '<div class="monthsel"><button data-mes="-1" aria-label="Mês anterior">‹</button><span>' + esc(C.nomeMes(view.ym).replace(' de ', ' ')) + '</span><button data-mes="1" aria-label="Próximo mês">›</button></div>' : '<button class="iconbtn" data-go="ajustes" aria-label="Ajustes">⚙️</button>') + '</div>';
  h += t === 'inicio' ? '<div class="hello">' + saudacao() + '<b>' + esc(nome || 'Que bom te ver!') + ' 👋</b></div>' : '<div class="hello"><b>' + esc(TITULOS[t] || '') + '</b></div>';
  h += '</header>';
  if (S.demo && !SERVER) h += '<div class="demo" role="note"><span>🧪 Você está vendo dados de exemplo.</span><button id="sair-demo">Começar o meu</button></div>';
  h += '<main class="content wrap">' + (t === 'inicio' ? avisoVerificar() : '') + (TELAS[t] || TELAS.inicio)() + '</main>';
  $('#app').innerHTML = h;
  const navs = [['inicio', '🏠', 'Início'], ['gastos', '📋', 'Gastos'], ['mic'], ['agenda', '📌', 'Agenda'], ['mais', '☰', 'Mais']];
  $('#nav').innerHTML = navs.map((n) => n[0] === 'mic' ? '<div class="micwrap"><button class="mic" id="fab" aria-label="Falar um gasto">🎤</button><small>Falar</small></div>' : '<button class="' + (t === n[0] || (n[0] === 'mais' && !['inicio', 'gastos', 'agenda'].includes(t)) ? 'on' : '') + '" data-go="' + n[0] + '"><span class="i">' + n[1] + '</span>' + n[2] + '</button>').join('');
  bind();
  const wa = $('#wa'); if (wa) wa.scrollTop = wa.scrollHeight;
}
const LOGO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-9.4-9.3C1.2 8.3 3.4 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.6 0 5.8 3.8 4.4 7.2C19.5 16.4 12 21 12 21z" fill="#1B3A6B"/><path d="M8.5 12.2l2.3 2.3 4.7-4.8" stroke="#FFC83D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function saudacao(){ const h = hoje().getHours(); return h < 12 ? 'Bom dia,' : h < 18 ? 'Boa tarde,' : 'Boa noite,'; }
function aplicarTema(){ const t = S.perfil.tema; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else if (S.perfil.temaAplicado) document.documentElement.removeAttribute('data-theme'); S.perfil.temaAplicado = t; }

// ------------------------------------------------------------ eventos
function bind(){
  const A = $('#app');
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { if (b.dataset.aba) view.abaGastos = b.dataset.aba; else if (b.dataset.go === 'gastos') view.abaGastos = view.abaGastos || 'gastos'; go(b.dataset.go); });

let rec = null, gravador = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const EXEMPLOS = ['gastei 45 no mercado', 'paguei 120 de luz', 'conta de internet vence dia 10, 110 reais', 'dentista amanhã às 15h', 'recebi 3500 de salário', 'exclui o gasto de 45'];
function abrirVoz(){
  sheet('<div class="voice"><h3 style="margin:0">Fale comigo 💬</h3><button class="bigmic" id="vz-mic" aria-label="Começar a falar">🎤</button><div class="transcript" id="vz-tx" aria-live="polite">Toque no microfone e fale</div><div class="hint" id="vz-hint">Diga um gasto, uma conta, um compromisso — ou peça para excluir.</div><div class="examples">' + EXEMPLOS.map((e) => '<button type="button">' + esc(e) + '</button>').join('') + '</div><form class="typebox" id="vz-form"><input id="vz-in" placeholder="…ou escreva aqui" autocomplete="off" aria-label="Escreva o que quer lançar"><button class="btn pri" type="submit">OK</button></form><div id="vz-res" style="width:100%"></div></div>', (root) => {
    $('#vz-mic').onclick = () => (rec || gravador) ? pararVoz() : ouvir();
    root.querySelectorAll('.examples button').forEach((b) => b.onclick = () => { $('#vz-in').value = b.textContent; previa(b.textContent); });
    $('#vz-form').onsubmit = (e) => { e.preventDefault(); const t = $('#vz-in').value.trim(); if (t) previa(t); };
    setTimeout(ouvir, 250);
  });
}
function ouvir(){
  const tx = $('#vz-tx'), mic = $('#vz-mic'); if (!tx) return;
  if (SR) {
    try {
      rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
      let final = '';
      rec.onresult = (e) => { let t = ''; for (const r of e.results) t += r[0].transcript; tx.textContent = '“' + t + '”'; if (e.results[e.results.length - 1].isFinal) final = t; };
      rec.onerror = (e) => { rec = null; mic.classList.remove('rec'); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { if (SERVER && navigator.mediaDevices) return gravar(); tx.textContent = 'Microfone bloqueado aqui 🙈'; $('#vz-hint').textContent = 'Libere o microfone no navegador ou escreva a frase abaixo — funciona igualzinho.'; } else if (e.error === 'no-speech') { tx.textContent = 'Não ouvi nada. Toque e tente de novo 🙂'; } };
      rec.onend = () => { mic.classList.remove('rec'); rec = null; if (final) { $('#vz-in').value = final; previa(final, 'voz'); } };
      rec.start(); mic.classList.add('rec'); tx.textContent = 'Estou ouvindo…'; return;
    } catch (e) { rec = null; }
  }
  if (SERVER && navigator.mediaDevices) return gravar();
  tx.textContent = 'Este navegador não reconhece voz 🙈'; $('#vz-hint').textContent = 'Use o Chrome ou o teclado de voz do celular (🎤 no teclado), ou escreva abaixo.'; $('#vz-in').focus();
}
async function gravar(){
  const tx = $('#vz-tx'), mic = $('#vz-mic');
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; gravador = new MediaRecorder(st); gravador.ondataavailable = (e) => chunks.push(e.data);
    gravador.onstop = async () => { st.getTracks().forEach((t) => t.stop()); gravador = null; mic.classList.remove('rec'); tx.textContent = 'Entendendo o áudio…'; try { const r = await fetch('/api/transcrever', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': chunks[0].type || 'audio/webm' }, body: new Blob(chunks) }); const j = await r.json(); if (j.texto) { tx.textContent = '“' + j.texto + '”'; $('#vz-in').value = j.texto; previa(j.texto, 'voz'); } else tx.textContent = 'Não consegui entender. Tente de novo.'; } catch(e){ tx.textContent = 'Sem conexão para entender o áudio.'; } };
    gravador.start(); mic.classList.add('rec'); tx.textContent = 'Gravando… toque de novo para terminar'; setTimeout(() => gravador && gravador.state === 'recording' && gravador.stop(), 15000);
  } catch (e) { tx.textContent = 'Microfone bloqueado 🙈'; $('#vz-hint').textContent = 'Escreva a frase abaixo — funciona igualzinho.'; }
}
function pararVoz(){ try { rec && rec.stop(); } catch(e){} try { gravador && gravador.state === 'recording' && gravador.stop(); } catch(e){} }
const ROTULO = { pagar_fatura: '💳 Pagar fatura', config_cartao: '💳 Ajustar cartão', resgate: '💸 Retirar do sonho', gasto: '🛒 Gasto', entrada: '💰 Entrada', parcelado: '🛍️ Compra parcelada', conta: '🧾 Conta fixa', compromisso: '📌 Compromisso', sonho: '⭐ Guardar para sonho', excluir: '🗑️ Excluir', desfazer: '↩️ Desfazer', pagar_conta: '✅ Conta paga' };
