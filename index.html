  const root = box; bindCat(root, (c) => { a.cat = c; });
  $('#vz-ok').onclick = () => { const r = C.aplicar(S, a, { hoje: hoje(), origem: origem || 'voz' }); fechar(); save(); toast(r.msg.split('\n')[0].replace(/\*/g, ''), r.ok && r.item && a.tipo !== 'sonho' && r.colecao !== 'contas' && r.colecao !== 'cartoes' && !(a.tipo === 'resgate' && r.colecao === 'sonhos') ? () => { C.remover(S, r.colecao, r.item.id); save(); } : null); if (a.tipo === 'sonho' && r.ok) confete(); if (!r.ok) toast(r.msg.split('\n')[0]); };
  $('#vz-ed').onclick = () => { if (a.tipo === 'gasto' || a.tipo === 'entrada') { fechar(); formLanc(null, a.tipo); $('#fl-v').value = String(a.valor).replace('.', ','); $('#fl-d').value = a.desc; $('#fl-dt').value = a.data; } else if (a.tipo === 'compromisso') { fechar(); formAgenda(); $('#fa-t').value = a.titulo; $('#fa-d').value = a.data; $('#fa-h').value = a.hora; } else if (a.tipo === 'conta') { fechar(); formConta(); $('#fc-n').value = a.nome; $('#fc-v').value = a.valor ? String(a.valor).replace('.', ',') : ''; $('#fc-d').value = a.dia; } else { $('#vz-in').focus(); } };
}

// ------------------------------------------------------------ simulador do WhatsApp
function conversar(t){
  S.chat = S.chat || []; S.chat.push({ de: 'me', txt: t, em: Date.now() });
  const a = C.interpretar(t, { hoje: hoje(), categorias: S.categorias, sonhos: S.sonhos, cartoes: S.cartoes });
  const r = C.aplicar(S, a, { hoje: hoje(), origem: 'whatsapp' });
  S.chat.push({ de: 'bot', txt: r.msg, em: Date.now() + 1000 });
  save(); const i = $('#wa-txt'); if (i) i.focus();
}

// ------------------------------------------------------------ boas-vindas
function onboarding(){
  const L = $('#layer');
  L.innerHTML = '<div class="ob" role="dialog" aria-modal="true"><div class="box"><span class="logo" style="width:64px;height:64px;border-radius:20px;background:var(--sun);display:grid;place-items:center">' + LOGO.replace(/22/g, '38') + '</span><h1>Sonhaí</h1><p>Seu dinheiro organizado de um jeito leve. Fale o gasto, eu anoto. Eu lembro das contas e ajudo você a realizar sonhos. 💙</p><div class="feat"><div><span>🎤</span>Lance gastos falando</div><div><span>💬</span>Lembretes no WhatsApp</div><div><span>⭐</span>Metas para os seus sonhos</div></div><input id="ob-n" placeholder="Seu nome ou da família" aria-label="Seu nome"><input id="ob-o" inputmode="decimal" placeholder="Quanto pode gastar por mês? (opcional)" aria-label="Orçamento mensal"><input id="ob-w" inputmode="tel" placeholder="Seu WhatsApp com DDD (opcional)" aria-label="WhatsApp"><button class="btn sun block" id="ob-ok" style="font-size:18px">Começar ✨</button><button class="btn block" id="ob-ex" style="background:rgba(255,255,255,.14);color:inherit">Ver primeiro com dados de exemplo</button></div></div>';
  $('#ob-ok').onclick = () => { const n = $('#ob-n').value.trim(); if (!n) { $('#ob-n').focus(); return; } const novo = C.estadoVazio(); novo.perfil.nome = n; novo.perfil.orcamento = num($('#ob-o').value); novo.perfil.whatsapp = $('#ob-w').value.trim(); novo.perfilUpd = Date.now(); S = novo; L.innerHTML = ''; save(); confete(); toast('🎉 Bem-vindo(a), ' + n.split(' ')[0] + '! Toque no 🎤 para lançar seu primeiro gasto.'); };
  $('#ob-ex').onclick = () => { S = exemplo(); L.innerHTML = ''; save(); };
}

// ------------------------------------------------------------ conta (usuário e senha)
async function api(rota, corpo){
  const r = await fetch(rota, { method: corpo ? 'POST' : 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: corpo ? JSON.stringify(corpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || 'Não foi possível agora. Tente de novo.');
  return j;
}
const campoSenha = (id, ph, ac) => '<div style="position:relative"><input id="' + id + '" type="password" placeholder="' + ph + '" autocomplete="' + ac + '" style="padding-right:56px"><button type="button" data-ver="' + id + '" aria-label="Mostrar senha" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:20px;color:#13233A">👁</button></div>';
function telaEntrar(modo){
  modo = modo || (codReset ? 'reset' : 'entrar');
  const L = $('#layer');
  const tit = { entrar: 'Que bom te ver de novo!', criar: 'Crie sua conta grátis', reset: 'Crie uma senha nova' }[modo];
  let corpo = '';
  if (modo === 'reset') corpo = campoSenha('ln-s', 'Nova senha (mín. 6 caracteres)', 'new-password') + campoSenha('ln-s2', 'Repita a nova senha', 'new-password');
  else corpo = (modo === 'criar' ? '<input id="ln-n" placeholder="Seu nome ou da família" autocomplete="name">' : '') + '<input id="ln-f" inputmode="tel" placeholder="Seu WhatsApp com DDD" autocomplete="tel">' + campoSenha('ln-s', modo === 'criar' ? 'Crie uma senha (mín. 6 caracteres)' : 'Sua senha', modo === 'criar' ? 'new-password' : 'current-password') + (modo === 'criar' ? campoSenha('ln-s2', 'Repita a senha', 'new-password') : '');
  L.innerHTML = '<div class="ob" role="dialog" aria-modal="true"><form class="box" id="ln-form" novalidate><span class="logo" style="width:64px;height:64px;border-radius:20px;background:var(--sun);display:grid;place-items:center">' + LOGO.replace(/22/g, '38') + '</span><h1>Sonhaí</h1><p>' + tit + ' 💙</p>' + (modo !== 'reset' ? '<div class="seg" style="background:rgba(255,255,255,.14)"><button type="button" data-m="entrar" class="' + (modo === 'entrar' ? 'on' : '') + '" style="color:inherit">Entrar</button><button type="button" data-m="criar" class="' + (modo === 'criar' ? 'on' : '') + '" style="color:inherit">Criar conta</button></div>' : '') + corpo + '<div id="ln-erro" role="alert" style="background:#FFE9E5;color:#B42318;border-radius:12px;padding:10px 12px;font-weight:700" hidden></div><button class="btn sun block" type="submit" style="font-size:18px" id="ln-ok">' + ({ entrar: 'Entrar', criar: 'Criar minha conta ✨', reset: 'Salvar nova senha' })[modo] + '</button>' + (modo === 'entrar' ? '<button type="button" class="btn block" id="ln-esq" style="background:transparent;color:inherit;text-decoration:underline">Esqueci minha senha</button>' : '') + '<p style="font-size:13px;opacity:.8">🔒 Sua senha é guardada criptografada. Seus dados são só seus.</p></form></div>';
  L.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => telaEntrar(b.dataset.m));
  L.querySelectorAll('[data-ver]').forEach((b) => b.onclick = () => { const i = $('#' + b.dataset.ver); i.type = i.type === 'password' ? 'text' : 'password'; });
  const erro = (m) => { const e = $('#ln-erro'); e.textContent = m; e.hidden = !m; };
  const esq = $('#ln-esq'); if (esq) esq.onclick = () => erro('') || sheet('<h3>🔐 Esqueci minha senha</h3><p>Mande a mensagem <b>esqueci minha senha</b> para o Sonhaí no WhatsApp' + (cfg.whatsapp ? ' (<b>' + esc(cfg.whatsapp) + '</b>)' : '') + '. Você vai receber um link para criar uma senha nova.</p><button class="btn pri block" id="esq-ok">Entendi</button>', () => { $('#esq-ok').onclick = fechar; });
  $('#ln-form').onsubmit = async (e) => {
    e.preventDefault(); erro('');
    const sn = $('#ln-s').value, s2 = $('#ln-s2') ? $('#ln-s2').value : sn;
    if (modo !== 'entrar' && sn !== s2) return erro('As senhas não são iguais.');
    const bt = $('#ln-ok'); bt.disabled = true; bt.textContent = 'Um instante…';
    try {
      let j;
      if (modo === 'reset') j = await api('/api/redefinir', { codigo: codReset, senha: sn });
      else if (modo === 'criar') j = await api('/api/cadastro', { nome: $('#ln-n').value, fone: $('#ln-f').value, senha: sn, estado: S.demo ? null : S });
      else j = await api('/api/login', { fone: $('#ln-f').value, senha: sn });
      token = j.token; codReset = ''; try { localStorage.setItem('cc-token', token); } catch(x){}
      if (modo !== 'criar') { S = C.estadoVazio(); store.set(S); }
      L.innerHTML = ''; await iniciarConta(true);
      if (modo === 'criar') { confete(); toast('🎉 Conta criada! Bem-vindo(a) ao Sonhaí.'); } else toast('💙 Que bom te ver!');
    } catch(err) { erro(err.message); bt.disabled = false; bt.textContent = ({ entrar: 'Entrar', criar: 'Criar minha conta ✨', reset: 'Salvar nova senha' })[modo]; }
  };
}
async function iniciarConta(primeira){
  try { conta = await api('/api/eu'); } catch(e){ return sairLocal(); }
  await pull();
  if (primeira) { setInterval(pull, 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); }); }
  render();
  if (!conta.temSenha) formSenha(true);
}
function formSenha(criar){
  sheet('<h3>🔐 ' + (criar ? 'Crie sua senha' : 'Trocar senha') + '</h3>' + (criar ? '<p class="sub">Assim você entra no Sonhaí em qualquer aparelho com seu WhatsApp e senha.</p>' : '') + '<form id="fsn">' + (criar ? '' : '<div class="field"><label for="sn-a">Senha atual</label><input id="sn-a" type="password" autocomplete="current-password"></div>') + '<div class="field"><label for="sn-n">Nova senha</label><input id="sn-n" type="password" autocomplete="new-password" placeholder="mín. 6 caracteres"></div><div class="field"><label for="sn-n2">Repita a nova senha</label><input id="sn-n2" type="password" autocomplete="new-password"></div><div class="note" id="sn-e" hidden style="color:var(--bad)"></div><button class="btn pri block" type="submit">Salvar senha</button></form>', () => {
    $('#fsn').onsubmit = async (e) => { e.preventDefault(); const er = $('#sn-e'); er.hidden = true; if ($('#sn-n').value !== $('#sn-n2').value) { er.textContent = 'As senhas não são iguais.'; er.hidden = false; return; } try { await api('/api/senha', { atual: $('#sn-a') ? $('#sn-a').value : '', nova: $('#sn-n').value }); conta.temSenha = true; fechar(); toast('🔐 Senha salva!'); } catch(x){ er.textContent = x.message; er.hidden = false; } };
  });
}
async function sair(todos){ try { await api('/api/sair', { todos: !!todos }); } catch(e){} sairLocal(); }
function sairLocal(){ token = ''; conta = null; try { localStorage.removeItem('cc-token'); localStorage.removeItem(KEY); } catch(e){} mem = null; S = C.estadoVazio(); render(); telaEntrar('entrar'); }
function blocoConta(){
  if (!SERVER) return '<section class="card"><h2 style="margin-bottom:8px">🔐 Minha conta</h2><div class="note">Nesta demonstração os dados ficam só neste aparelho. No app publicado você entra com <b>WhatsApp + senha</b> e seus dados ficam protegidos e sincronizados entre aparelhos.</div></section>';
  if (!conta) return '';
  return '<section class="card"><h2 style="margin-bottom:8px">🔐 Minha conta</h2><div class="list"><div class="item"><span class="ico" style="background:var(--tile-in)">📱</span><span class="mid"><span class="ttl">+' + esc(conta.fone) + '</span><span class="meta">' + (conta.verificado ? 'WhatsApp confirmado ✓' : 'WhatsApp aguardando confirmação') + '</span></span></div></div><div class="btnrow" style="margin-top:8px"><button class="btn ghost" id="ct-senha">🔑 ' + (conta.temSenha ? 'Trocar senha' : 'Criar senha') + '</button><button class="btn ghost" id="ct-sair">🚪 Sair</button></div><button class="btn danger block" style="margin-top:8px" id="ct-todos">Sair de todos os aparelhos</button></section>';
}
function avisoVerificar(){
  if (!conta || conta.verificado) return '';
  const msg = 'SONHAI ' + conta.codigo;
  return '<section class="card" style="background:var(--tile-dream)"><h2 style="font-size:18px">📲 Falta só confirmar seu WhatsApp</h2><p style="margin:8px 0">Mande a mensagem <b class="num" style="font-size:18px">' + msg + '</b> para o Sonhaí' + (cfg.whatsapp ? ' no número <b>' + esc(cfg.whatsapp) + '</b>' : '') + '. Assim você lança gastos e recebe lembretes por lá.</p>' + (cfg.whatsapp ? '<a class="btn sun block" href="https://wa.me/' + esc(cfg.whatsapp.replace(/\D/g, '')) + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Abrir WhatsApp</a>' : '') + '</section>';
}

// ------------------------------------------------------------ início
const h0 = (location.hash || '').slice(1); if (TELAS[h0]) view.tela = h0;
window.addEventListener('hashchange', () => { const x = location.hash.slice(1); if (TELAS[x] && x !== view.tela) { view.tela = x; render(); } });
render();
if (SERVER) { fetch('/api/config').then((r) => r.json()).then((j) => { cfg = j; }).catch(() => {}); if (token) iniciarConta(true); else telaEntrar(); }
if (SERVER && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('/sw.js').catch(() => {}); } catch(e){} }
})();
</script>
